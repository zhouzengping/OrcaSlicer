<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orca SDK Test Page</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --card-bg: #ffffff;
        --text: #1f2328;
        --muted: #59636e;
        --border: #d8dee4;
        --pass: #1a7f37;
        --pass-bg: #e6ffec;
        --fail: #c93c37;
        --fail-bg: #ffebe9;
        --run: #9a6700;
        --run-bg: #fff8c5;
        --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #15181d;
            --card-bg: #1e2228;
            --text: #e6e8eb;
            --muted: #9aa4b2;
            --border: #333a42;
            --pass: #3fb950;
            --pass-bg: #12261e;
            --fail: #f85149;
            --fail-bg: #2d1517;
            --run: #d29922;
            --run-bg: #2b2412;
            --accent: #4493f8;
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-size: 14px;
        line-height: 1.5;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 20px; }
    section { margin-bottom: 24px; }
    .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 12px;
    }
    .card > header {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .card h2 { font-size: 15px; margin: 0; flex: 1; }
    .badge {
        font-size: 12px;
        font-weight: 600;
        padding: 2px 10px;
        border-radius: 10px;
        white-space: nowrap;
    }
    .badge.pass { color: var(--pass); background: var(--pass-bg); }
    .badge.fail { color: var(--fail); background: var(--fail-bg); }
    .badge.run  { color: var(--run);  background: var(--run-bg); }
    pre {
        margin: 10px 0 0;
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--bg);
        border: 1px solid var(--border);
        overflow-x: auto;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-all;
    }
    #hello-grid { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; }
    #hello-grid .k { color: var(--muted); }
    #hello-grid ul { margin: 0; padding-left: 18px; }
    #sdk-missing {
        display: none;
        border: 1px solid var(--fail);
        color: var(--fail);
        background: var(--fail-bg);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 20px;
        font-weight: 600;
    }
</style>
</head>
<body>
    <h1>Orca SDK Test Page</h1>
    <p class="subtitle">Verifies the webview + jsbridge + plugin host stack end to end.</p>

    <div id="sdk-missing">SDK not available</div>

    <section>
        <div class="card" id="hello-card">
            <header><h2>Hello handshake</h2></header>
            <div id="hello-grid"></div>
        </div>
    </section>

    <section id="tests"></section>

    <script src="test_page.js"></script>
</body>
</html>
