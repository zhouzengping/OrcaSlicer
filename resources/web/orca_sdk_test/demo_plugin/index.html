<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Plugin</title>
<style>
    :root {
        color-scheme: light dark;
        --text: #1f2328;
        --muted: #59636e;
        --border: #d8dee4;
        --bg: #f5f6f8;
        --card-bg: #ffffff;
        --fail: #c93c37;
        --pass: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --text: #e6e8eb;
            --muted: #9aa4b2;
            --border: #333a42;
            --bg: #15181d;
            --card-bg: #1e2228;
            --fail: #f85149;
            --pass: #3fb950;
        }
    }
    body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-size: 14px;
    }
    h1 { font-size: 18px; margin: 0 0 16px; }
    .row {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 12px;
    }
    .row p { margin: 0 0 8px; }
    pre {
        margin: 0;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-all;
        color: var(--muted);
    }
    button {
        font: inherit;
        padding: 4px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
        cursor: pointer;
    }
    .denied { color: var(--fail); }
    .granted { color: var(--pass); }
</style>
</head>
<body>
    <h1>demo plugin loaded</h1>
    <div class="row">
        <p>demo.echo result:</p>
        <pre id="echo-result">calling...</pre>
    </div>
    <div class="row">
        <p>demo.permissionProtected result
            (denied before the host grants <code>demo.special</code>, ok after):</p>
        <p><button id="probe" type="button">Call demo.permissionProtected</button></p>
        <pre id="perm-result">not called yet</pre>
    </div>
    <script>
    'use strict';

    function render(id, text) {
        document.getElementById(id).textContent = text;
    }

    function jsonOf(value) {
        try { return JSON.stringify(value, null, 2); } catch (e) { return String(value); }
    }

    (function main() {
        if (!window.orca) {
            render('echo-result', 'SDK not available');
            render('perm-result', 'SDK not available');
            return;
        }
        window.orca.call('demo.echo', { text: 'ping from plugin' })
            .then((result) => render('echo-result', jsonOf(result)))
            .catch((err) => render('echo-result', 'error: ' + jsonOf({ code: err && err.code, message: err && err.message })));

        document.getElementById('probe').addEventListener('click', async () => {
            const target = document.getElementById('perm-result');
            target.textContent = 'calling...';
            target.className = '';
            try {
                const result = await window.orca.call('demo.permissionProtected', {});
                target.textContent = 'ok: ' + jsonOf(result);
                target.className = 'granted';
            } catch (err) {
                target.textContent = 'error: ' + jsonOf({ code: err && err.code, message: err && err.message });
                target.className = 'denied';
            }
        });
    })();
    </script>
</body>
</html>
