      zh_CN: "由打印机结构约束的最大可打印高度"
    sidetext:
      text: "mm"
  support_multi_bed_types:
    label:
      text: "Support multi bed types"
      zh_CN: "支持多种打印床类型"
    tooltip:
      text: "Enable this option if you want to use multiple bed types."
      zh_CN: "如果要使用多种打印床类型，请启用此选项"
  nozzle_volume:
    label:
      text: "Nozzle volume"
      zh_CN: "喷嘴内腔体积"
    tooltip:
      text: "Volume of nozzle between the cutter and the end of nozzle."
      zh_CN: "从切刀位置到喷嘴尖端的内腔体积"
    sidetext:
      text: "mm³"
  best_object_pos:
    label:
      text: "Best object position"
      zh_CN: "最佳对象位置"
    tooltip:
      text: "Best auto arranging position in range [0,1] w.r.t. bed shape."
      zh_CN: "最佳自动排列位置在[0,1]范围内，相对于打印床形状。"
  z_offset:
    label:
      text: "Z offset"
      zh_CN: "Z偏移"
    tooltip:
      text: "This value will be added (or subtracted) from all the Z coordinates in the output G-code. It is used to compensate for bad Z endstop position: for example, if your endstop zero actually leaves the nozzle 0.3mm far from the print bed, set this to -0.3 (or fix your endstop)."
      zh_CN: "此值将从输出 G-Code 中的所有 Z 坐标中添加(或减去)。它用于补偿损坏的 Z 端限位器置：例如，如果限位器零实际离开喷嘴 0.3mm 远离构建板(打印床)，将其设置为 -0.3（或调整限位器）。"
    sidetext:
      text: "mm"
  preferred_orientation:
    label:
      text: "Preferred orientation"
      zh_CN: "零件朝向偏好"
    tooltip:
      text: "Automatically orient stls on the Z axis upon initial import."
      zh_CN: "导入模型时自动旋转到指定的朝向"
    sidetext:
      text: "°"
  printer_structure:
    label:
      text: "Printer structure"
      zh_CN: "打印机结构"
    tooltip:
      text: "The physical arrangement and components of a printing device."
      zh_CN: "打印设备的物理结构和组件"
    enum_labels:
      - text: "Undefine"
        zh_CN: "未定义"
      - text: "CoreXY"
      - text: "I3"
      - text: "Hbot"
      - text: "Delta"
        zh_CN: "Delta（三角洲）"
  gcode_flavor:
    label:
      text: "G-code flavor"
      zh_CN: "G-code风格"
    tooltip:
      text: "What kind of G-code the printer is compatible with."
      zh_CN: "打印机兼容的G-code风格'"
    enum_labels:
      - text: "Marlin(legacy)"
      - text: "Klipper"
        zh_CN: "Klipper固件"
      - text: "RepRapFirmware"
      - text: "Marlin 2"
  pellet_modded_printer:
    label:
      text: "Pellet Modded Printer"
      zh_CN: "颗粒改装打印机"
    tooltip:
      text: "Enable this option if your printer uses pellets instead of filaments."
      zh_CN: "如果您的打印机使用颗粒而不是耗材丝，请启用此选项"
  bbl_use_printhost:
    label:
      text: "Use 3rd-party print host"
      zh_CN: "启用第三方网络连接"
    tooltip:
      text: "Allow controlling BambuLab's printer through 3rd party print hosts."
      zh_CN: "允许通过第三方网络连接控制BambuLab的打印机"
  disable_m73:
    label:
      text: "Disable set remaining print time"
      zh_CN: "禁用M73剩余打印时间"
    tooltip:
      text: "Disable generating of the M73: Set remaining print time in the final G-code."
      zh_CN: "在最终生成的G-code中禁用M73命令：设置剩余打印时间"
  thumbnails:
    label:
      text: "G-code thumbnails"
      zh_CN: "G-code缩略图尺寸"
    tooltip:
      text: "Picture sizes to be stored into a .gcode and .sl1 / .sl1s files, in the following format: \"XxY, XxY, ...\""
  use_relative_e_distances:
    label:
      text: "Use relative E distances"
      zh_CN: "使用相对E距离"
    tooltip:
      text: "Relative extrusion is recommended when using \"label_objects\" option. Some extruders work better with this option unchecked (absolute extrusion mode). Wipe tower is only compatible with relative mode. It is recommended on most printers. Default is checked."
      zh_CN: "相对挤出建议在使用\"label_objects\"选项时使用。某些挤出机在未选中此选项（绝对挤出模式）时工作得更好。擦拭塔仅与相对模式兼容。建议在大多数打印机上使用。默认为选中状态。"
  use_firmware_retraction:
    label:
      text: "Use firmware retraction"
      zh_CN: "使用固件回抽"
    tooltip:
      text: "This experimental setting uses G10 and G11 commands to have the firmware handle the retraction. This is only supported in recent Marlin."
      zh_CN: "（实验设置）使用G10和G11命令让固件处理回抽。该功能仅支持最近版本的Marlin固件。"
  time_cost:
    label:
      text: "Time cost"
      zh_CN: "时间花费"
    tooltip:
      text: "The printer cost per hour."
      zh_CN: "打印机每小时的成本"
    sidetext:
      text: "money/h"
      zh_CN: "元/时"
  fan_speedup_time:
    tooltip:
      text: "Start the fan this number of seconds earlier than its target start time (you can use fractional seconds). It assumes infinite acceleration for this time estimation, and will only take into account G1 and G0 moves (arc fitting is unsupported).\nIt won't move fan commands from custom G-code (they act as a sort of 'barrier').\nIt won't move fan commands into the start G-code if the 'only custom start G-code' is activated.\nUse 0 to deactivate."
    sidetext:
      text: "s"
  fan_speedup_overhangs:
    label:
      text: "Only overhangs"
      zh_CN: "仅悬垂"
    tooltip:
      text: "Will only take into account the delay for the cooling of overhangs."
      zh_CN: "仅对悬垂有效"
  fan_kickstart:
    label:
      text: "Fan kick-start time"
      zh_CN: "风扇"
    tooltip:
      text: "Emit a max fan speed command for this amount of seconds before reducing to target speed to kick-start the cooling fan.\nThis is useful for fans where a low PWM/power may be insufficient to get the fan started spinning from a stop, or to get the fan up to speed faster.\nSet to 0 to deactivate."
      zh_CN: "让风扇满速运行指定时间以帮助风扇顺利启动\n设为0禁用此选项"
    sidetext:
      text: "s"
  extruder_clearance_radius:
    label:
      text: "Radius"
      zh_CN: "半径"
    tooltip:
      text: "Clearance radius around extruder. Used for collision avoidance in by-object printing."
      zh_CN: "挤出机四周的避让半径。用于在逐件打印中避免碰撞。"
    sidetext:
      text: "mm"
  extruder_clearance_height_to_rod:
    label:
      text: "Height to rod"
      zh_CN: "到横杆高度"
    tooltip:
      text: "Distance of the nozzle tip to the lower rod. Used for collision avoidance in by-object printing."
      zh_CN: "喷嘴尖端到下方滑杆的距离。用于在逐件打印中避免碰撞。"
    sidetext:
      text: "mm"
  extruder_clearance_height_to_lid:
    label:
      text: "Height to lid"
      zh_CN: "到顶盖高度"
    tooltip:
      text: "Distance of the nozzle tip to the lid. Used for collision avoidance in by-object printing."
      zh_CN: "喷嘴尖端到顶盖的距离。用于在逐件打印中避免碰撞。"
    sidetext:
      text: "mm"
  bed_mesh_min:
    label:
      text: "Bed mesh min"
      zh_CN: "网床最小点"
    tooltip:
      text: "This option sets the min point for the allowed bed mesh area. Due to the probe's XY offset, most printers are unable to probe the entire bed. To ensure the probe point does not go outside the bed area, the minimum and maximum points of the bed mesh should be set appropriately. Snapmaker Orca ensures that adaptive_bed_mesh_min/adaptive_bed_mesh_max values do not exceed these min/max points. This information can usually be obtained from your printer manufacturer. The default setting is (-99999, -99999), which means there are no limits, thus allowing probing across the entire bed."
      zh_CN: "此选项设置了允许的网床探测区域的最小点。由于探针的XY偏移，大多数打印机无法探测整个打印床。为了确保探针不会超出床的范围，应适当设置网床的最小和最大点。逆戟鲸切片确保adaptive_bed_mesh_min/adaptive_bed_mesh_max值不超过这些最小/最大点。这些信息通常可以从您的打印机制造商那里获得。默认设置为(-99999, -99999)，这意味着没有限制，因此允许在整个床上进行探测。"
    sidetext:
      text: "mm"
  bed_mesh_max:
    label:
      text: "Bed mesh max"
      zh_CN: "网床最大点"
    tooltip:
      text: "This option sets the max point for the allowed bed mesh area. Due to the probe's XY offset, most printers are unable to probe the entire bed. To ensure the probe point does not go outside the bed area, the minimum and maximum points of the bed mesh should be set appropriately. Snapmaker_Orca ensures that adaptive_bed_mesh_min/adaptive_bed_mesh_max values do not exceed these min/max points. This information can usually be obtained from your printer manufacturer. The default setting is (99999, 99999), which means there are no limits, thus allowing probing across the entire bed."
    sidetext:
      text: "mm"
  bed_mesh_probe_distance:
    label:
      text: "Probe point distance"
      zh_CN: "网格点间距离"
    tooltip:
      text: "This option sets the preferred distance between probe points (grid size) for the X and Y directions, with the default being 50mm for both X and Y."
      zh_CN: "此选项设置了X和Y方向的探针点（网格大小）之间的首选距离，其默认值为X和Y方向均为50mm。"
    sidetext:
      text: "mm"
  adaptive_bed_mesh_margin:
    label:
      text: "Mesh margin"
      zh_CN: "网床边缘外扩"
    tooltip:
      text: "This option determines the additional distance by which the adaptive bed mesh area should be expanded in the XY directions."
      zh_CN: "此选项决定了自适应网床网格区域在XY方向上应扩展的额外距离。"
    sidetext:
      text: "mm"
  nozzle_type:
    label:
      text: "Nozzle type"
      zh_CN: "喷嘴类型"
    tooltip:
      text: "The metallic material of nozzle. This determines the abrasive resistance of nozzle, and what kind of filament can be printed."
      zh_CN: "喷嘴的金属材料。这将决定喷嘴的耐磨性，以及可打印材料的种类"
    enum_labels:
