    sidetext:
      text: "mm"
  min_layer_height:
    label:
      text: "Min"
      zh_CN: "最小"
    tooltip:
      text: "The lowest printable layer height for the extruder. Used to limit the minimum layer height when enable adaptive layer height."
    sidetext:
      text: "mm"
  max_layer_height:
    label:
      text: "Max"
      zh_CN: "最大"
    tooltip:
      text: "The highest printable layer height for the extruder. Used to limit the maximum layer height when enable adaptive layer height."
    sidetext:
      text: "mm"
  extruder_offset:
    label:
      text: "Extruder offset"
      zh_CN: "挤出机偏移"
    sidetext:
      text: "mm"
  retraction_length:
    label:
      text: "Length"
      zh_CN: "长度"
    full_label:
      text: "Retraction Length"
      zh_CN: "回抽长度"
    tooltip:
      text: "Some amount of material in extruder is pulled back to avoid ooze during long travel. Set zero to disable retraction."
    sidetext:
      text: "mm"
  retract_restart_extra:
    label:
      text: "Extra length on restart"
      zh_CN: "额外回填长度"
    tooltip:
      text: "When the retraction is compensated after the travel move, the extruder will push this additional amount of filament. This setting is rarely needed."
      zh_CN: "每当空驶后回抽被补偿时，挤出机将推入额外数量的耗材丝。很少需要此设置。"
    sidetext:
      text: "mm"
  retraction_speed:
    label:
      text: "Retraction Speed"
      zh_CN: "回抽速度"
    full_label:
      text: "Retraction Speed"
      zh_CN: "回抽速度"
    tooltip:
      text: "Speed for retracting filament from the nozzle."
      zh_CN: "从喷嘴回抽耗材的速度"
    sidetext:
      text: "mm/s"
  deretraction_speed:
    label:
      text: "De-retraction Speed"
      zh_CN: "装填速度"
    full_label:
      text: "De-retraction Speed"
      zh_CN: "装填速度"
    tooltip:
      text: "Speed for reloading filament into the nozzle. Zero means same speed of retraction."
    sidetext:
      text: "mm/s"
  retraction_minimum_travel:
    label:
      text: "Travel distance threshold"
      zh_CN: "空驶距离阈值"
    tooltip:
      text: "Only trigger retraction when the travel distance is longer than this threshold."
      zh_CN: "只在空驶距离大于该数值时触发回抽。"
    sidetext:
      text: "mm"
  retract_when_changing_layer:
    label:
      text: "Retract when change layer"
      zh_CN: "换层时回抽"
    tooltip:
      text: "Force a retraction when changes layer."
      zh_CN: "强制在换层时回抽。"
  wipe:
    label:
      text: "Wipe while retracting"
      zh_CN: "回抽时擦拭"
    tooltip:
      text: "Move nozzle along the last extrusion path when retracting to clean any leaked material on the nozzle. This can minimize blobs when printing a new part after traveling."
      zh_CN: "当回抽时，让喷嘴沿着前面的走线方向继续移动，清除掉喷嘴上的漏料。这能够避免空驶结束打印新的区域时产生斑点。"
  wipe_distance:
    label:
      text: "Wipe Distance"
      zh_CN: "擦拭距离"
    tooltip:
      text: "Describe how long the nozzle will move along the last path when retracting.\n\nDepending on how long the wipe operation lasts, how fast and long the extruder/filament retraction settings are, a retraction move may be needed to retract the remaining filament.\n\nSetting a value in the retract amount before wipe setting below will perform any excess retraction before the wipe, else it will be performed after."
      zh_CN: "喷嘴在回抽时将沿着最后路径移动的距离\n\n根据擦拭操作的距离以及挤出机/耗材丝回抽的速度和长度，可能需要执行额外的回抽动作以收回剩余的丝材。\n\n在下方的擦拭前回抽量设置中输入一个数值，将在擦拭动作之前执行任何超出部分的回抽，否则超出部分的回抽将在擦拭之后执行。"
    sidetext:
      text: "mm"
  retract_before_wipe:
    label:
      text: "Retract amount before wipe"
      zh_CN: "擦拭前的回抽量"
    tooltip:
      text: "The length of fast retraction before wipe, relative to retraction length."
      zh_CN: "擦拭之前的回抽长度，用总回抽长度的百分比表示。"
    sidetext:
      text: "%"
  retract_lift_enforce:
    label:
      text: "On surfaces"
      zh_CN: "仅表面抬Z"
    tooltip:
      text: "Enforce Z-Hop behavior. This setting is impacted by the above settings (Only lift Z above/below)."
      zh_CN: "强制Z抬升行为。此设置受上述设置的影响（仅在高度以下抬Z/仅在高度以上抬Z）。"
    enum_labels:
      - text: "All Surfaces"
        zh_CN: "所有表面"
      - text: "Top Only"
        zh_CN: "仅顶面"
      - text: "Bottom Only"
        zh_CN: "仅底面"
      - text: "Top and Bottom"
        zh_CN: "顶面和地面"
  z_hop_types:
    label:
      text: "Z-hop type"
      zh_CN: "Z抬升类型"
    tooltip:
      text: "Type of Z-hop."
      zh_CN: "Z轴抬升类型。"
    enum_labels:
      - text: "Auto"
        zh_CN: "自动"
      - text: "Normal"
        zh_CN: "普通"
      - text: "Slope"
        zh_CN: "梯形"
      - text: "Spiral"
        zh_CN: "螺旋"
  z_hop:
    label:
      text: "Z-hop height"
      zh_CN: "Z抬升高度"
    tooltip:
      text: "Whenever the retraction is done, the nozzle is lifted a little to create clearance between nozzle and the print. It prevents nozzle from hitting the print when travel move. Using spiral lines to lift Z can prevent stringing."
      zh_CN: "回抽完成之后，喷嘴轻微抬升，和打印件之间产生一定间隙。这能够避免空驶时喷嘴和打印件剐蹭和碰撞。使用螺旋线抬升z能够减少拉丝。"
    sidetext:
      text: "mm"
  z_hop_when_prime:
    label:
      text: "Z hop when moving to tower"
      zh_CN: "移动到擦拭塔时Z抬升"
  travel_slope:
    label:
      text: "Traveling angle"
      zh_CN: "空驶抬高角度"
    tooltip:
      text: "Traveling angle for Slope and Spiral Z-hop type. Setting it to 90° results in Normal Lift."
    sidetext:
      text: "°"
  retract_lift_above:
    label:
      text: "Only lift Z above"
      zh_CN: "仅在高度以上抬Z"
    tooltip:
      text: "If you set this to a positive value, Z lift will only take place above the specified absolute Z."
      zh_CN: "如果将其设置为正值，则Z抬升仅在指定的绝对Z之上发生"
    sidetext:
      text: "mm"
  retract_lift_below:
    label:
      text: "Only lift Z below"
      zh_CN: "仅在高度以下抬Z"
    tooltip:
      text: "If you set this to a positive value, Z lift will only take place below the specified absolute Z."
      zh_CN: "如果将其设置为正值，则Z抬升仅在指定的绝对Z以下发生。"
    sidetext:
      text: "mm"
  retract_length_toolchange:
    label:
      text: "Retraction Length (Toolchange)"
    full_label:
      text: "Retraction Length (Toolchange)"
    sidetext:
      text: "mm"
  retract_restart_extra_toolchange:
    label:
      text: "Extra length on restart"
      zh_CN: "额外回填长度"
    tooltip:
      text: "When the retraction is compensated after changing tool, the extruder will push this additional amount of filament."
      zh_CN: "当换色后回抽被补偿时，挤出机将推入额外数量的耗材丝。"
    sidetext:
      text: "mm"
  long_retractions_when_cut:
    label:
      text: "Long retraction when cut (beta)"
      zh_CN: "切料时回抽（实验）"
    tooltip:
      text: "Experimental feature: Retracting and cutting off the filament at a longer distance during changes to minimize purge. While this reduces flush significantly, it may also raise the risk of nozzle clogs or other printing problems."
      zh_CN: "实验性选项。在更换耗材丝时，将耗材丝回抽一段距离后再切断以最小化冲刷。虽然这大大减少了冲刷，但也可能增加喷嘴堵塞或其他打印问题的风险。"
  retraction_distances_when_cut:
    label:
      text: "Retraction distance when cut"
      zh_CN: "切料回抽距离"
    tooltip:
      text: "Experimental feature: Retraction length before cutting off during filament change."
      zh_CN: "实验性选项。在更换耗材丝时，切断前的回抽长度"
  single_extruder_multi_material:
    label:
      text: "Single Extruder Multi Material"
      zh_CN: "单挤出机多材料"
    tooltip:
      text: "Use single nozzle to print multi filament."
      zh_CN: "使用单喷嘴打印多耗材"
  manual_filament_change:
    label:
      text: "Manual Filament Change"
      zh_CN: "手动更换丝材"
    tooltip:
      text: "Enable this option to omit the custom Change filament G-code only at the beginning of the print. The tool change command (e.g., T0) will be skipped throughout the entire print. This is useful for manual multi-material printing, where we use M600/PAUSE to trigger the manual filament change action."
      zh_CN: "启用该选项可以在打印开始时省略自定义更换耗材丝的 G-code。整个打印过程中的工具头指令（如 T0）将会被跳过。这对于手动多材料打印十分有用，其将会使用 M600/PAUSE 指令来使您可以进行手动对耗材丝进行更换。"
  purge_in_prime_tower:
    label:
      text: "Purge in prime tower"
      zh_CN: "冲刷进擦拭塔"
    tooltip:
      text: "Purge remaining filament into prime tower."
      zh_CN: "冲刷剩余的耗材丝进入擦拭塔"
  enable_filament_ramming:
    label:
      text: "Enable filament ramming"
      zh_CN: "启用耗材尖端成型"
    tooltip:
      text: "Enable filament ramming"
      zh_CN: "启用耗材尖端成型"
  ramming_line_width_ratio:
    label:
      text: "Ramming line width ratio"
      zh_CN: "冲刷线宽比"
    tooltip:
      text: "This is used to decide the line width of wipe tower when ramming, ramming line width = [this ratio] * extruder * 1.25"
  enable_change_pressure_when_wiping:
    label:
      text: "Enable change pressure advance when wiping"
      zh_CN: "擦拭时压力提前启用"
    tooltip:
      text: "If it's set to false, the pressure advance value will not be changed."
  ramming_pressure_advance_value:
    label:
      text: "Pressure advance value when ramming"
      zh_CN: "冲刷时压力提前值"
    tooltip:
      text: "Set_Pressure_advance [this value] when ramming on wipe tower"
  cooling_tube_retraction:
    label:
      text: "Cooling tube position"
      zh_CN: "喉管位置"
    tooltip:
      text: "Distance of the center-point of the cooling tube from the extruder tip."
      zh_CN: "喉管的中心点与挤出机齿尖的距离。"
    sidetext:
      text: "mm"
  cooling_tube_length:
    label:
      text: "Cooling tube length"
      zh_CN: "喉管长度"
    tooltip:
      text: "Length of the cooling tube to limit space for cooling moves inside it."
      zh_CN: "喉管的长度，用于限制冷却内部移动的空间。"
    sidetext:
      text: "mm"
  parking_pos_retraction:
    label:
      text: "Filament parking position"
      zh_CN: "耗材停靠位置"
    tooltip:
      text: "Distance of the extruder tip from the position where the filament is parked when unloaded. This should match the value in printer firmware."
      zh_CN: "卸载时，挤出机齿尖与耗材停放位置的距离。这应该与打印机固件中的值相匹配。"
    sidetext:
      text: "mm"
  extra_loading_move:
    label:
      text: "Extra loading distance"
      zh_CN: "额外加载距离"
    tooltip:
      text: "When set to zero, the distance the filament is moved from parking position during load is exactly the same as it was moved back during unload. When positive, it is loaded further, if negative, the loading move is shorter than unloading."
      zh_CN: "当设置为零时，耗材的加载移动与卸载移动的距离相同。如果为正，加载比卸载长。如果为负，加载比卸载短。"
    sidetext:
      text: "mm"
  high_current_on_filament_swap:
    label:
      text: "High extruder current on filament swap"
      zh_CN: "更换耗材挤出机大电流"
    tooltip:
      text: "It may be beneficial to increase the extruder motor current during the filament exchange sequence to allow for rapid ramming feed rates and to overcome resistance when loading a filament with an ugly shaped tip."
      zh_CN: "可能有益于换耗材过程中增加挤出机电流，克服加载耗材时的阻力以加快尖端成型进料速率从而避免产生难看形状的尖端。"
  machine_load_filament_time:
    label:
      text: "Filament load time"
      zh_CN: "加载耗材丝的时间"
    tooltip:
      text: "Time to load new filament when switch filament. It's usually applicable for single-extruder multi-material machines. For tool changers or multi-tool machines, it's typically 0. For statistics only."
      zh_CN: "换料时加载新耗材所需的时间。通常适用于单挤出机多材料机器。对于换工具器或多工具机器，此值通常为0。仅用于统计。"
    sidetext:
      text: "s"
  machine_unload_filament_time:
    label:
      text: "Filament unload time"
      zh_CN: "卸载耗材丝的时间"
    tooltip:
      text: "Time to unload old filament when switch filament. It's usually applicable for single-extruder multi-material machines. For tool changers or multi-tool machines, it's typically 0. For statistics only."
      zh_CN: "换料时卸载旧耗材所需的时间。通常适用于单挤出机多材料机器。对于换工具器或多工具机器，此值通常为0。仅用于统计。"
    sidetext:
      text: "s"
  machine_tool_change_time:
    label:
      text: "Tool change time"
      zh_CN: "换工具头所需时间"
    tooltip:
      text: "Time taken to switch tools. It's usually applicable for tool changers or multi-tool machines. For single-extruder multi-material machines, it's typically 0. For statistics only."
      zh_CN: "换工具所需的时间。通常适用于换工具器或多工具机器。对于单挤出机多材料机器，此值通常为0。仅用于统计。"
    sidetext:
      text: "s"
  tool_change_temprature_wait:
    label:
      text: "Wait for the temperature when changing tools"
      zh_CN: "换头时等待温度达标"
    tooltip:
      text: "It will use the M109 instead of M104 T[target] after changing tools if this is set to true"
  printer_notes:
    label:
      text: "Printer notes"
      zh_CN: "打印机注释"
    tooltip:
      text: "You can put your notes regarding the printer here."
      zh_CN: "你可以把你关于打印机的注释放在这里。"
