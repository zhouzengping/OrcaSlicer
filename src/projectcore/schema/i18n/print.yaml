      - text: "Normal (manual)"
        zh_CN: "普通(手动)"
      - text: "Tree (manual)"
        zh_CN: "树状(手动)"
  support_style:
    label:
      text: "Style"
      zh_CN: "样式"
    tooltip:
      text: "Style and shape of the support. For normal support, projecting the supports into a regular grid will create more stable supports (default), while snug support towers will save material and reduce object scarring.\nFor tree support, slim and organic style will merge branches more aggressively and save a lot of material (default organic), while hybrid style will create similar structure to normal support under large flat overhangs."
      zh_CN: "支撑物的样式和形状。对于普通支撑，将支撑投射到一个规则的网格中，将创建更稳定的支撑（默认），而紧贴的支撑塔将节省材料并减少物体的瑕疵。\n对于树形支撑，苗条树将更激进地合并树枝，并节省大量的材料；粗壮树会产生更大更强壮的支撑结构，但用料更多；而混合树是苗条树和普通支撑的结合，它会在大的平面悬垂下创建与正常支撑类似的结构（默认）。"
    category:
      text: "Support"
      zh_CN: "支撑"
    enum_labels:
      - text: "Default (Grid/Organic)"
        zh_CN: "默认 (网格/有机)"
      - text: "Grid"
        zh_CN: "网格"
      - text: "Snug"
        zh_CN: "紧贴"
      - text: "Organic"
        zh_CN: "有机树"
      - text: "Tree Slim"
        zh_CN: "苗条树"
      - text: "Tree Strong"
        zh_CN: "粗壮树"
      - text: "Tree Hybrid"
        zh_CN: "混合树"
  support_threshold_angle:
