  default_junction_deviation:
    label:
      text: "Junction Deviation"
      zh_CN: "结点偏差"
    tooltip:
      text: "Marlin Firmware Junction Deviation (replaces the traditional XY Jerk setting)."
    sidetext:
      text: "mm"
  max_volumetric_extrusion_rate_slope:
    label:
      text: "Extrusion rate smoothing"
      zh_CN: "平滑挤出率"
    tooltip:
      text: "This parameter smooths out sudden extrusion rate changes that happen when the printer transitions from printing a high flow (high speed/larger width) extrusion to a lower flow (lower speed/smaller width) extrusion and vice versa.\n\nIt defines the maximum rate by which the extruded volumetric flow in mm³/s can change over time. Higher values mean higher extrusion rate changes are allowed, resulting in faster speed transitions.\n\nA value of 0 disables the feature.\n\nFor a high speed, high flow direct drive printer (like the Bambu lab or Voron) this value is usually not needed. However it can provide some marginal benefit in certain cases where feature speeds vary greatly. For example, when there are aggressive slowdowns due to overhangs. In these cases a high value of around 300-350 mm³/s² is recommended as this allows for just enough smoothing to assist pressure advance achieve a smoother flow transition.\n\nFor slower printers without pressure advance, the value should be set much lower. A value of 10-15 mm³/s² is a good starting point for direct drive extruders and 5-10 mm³/s² for Bowden style.\n\nThis feature is known as Pressure Equalizer in Prusa slicer.\n\nNote: this parameter disables arc fitting."
      zh_CN: "此参数是打印机从打印高流量挤出（高速/较大宽度）向低流量挤出（低速/较小宽度）时用于突然变化挤出速率的平滑，反之亦然。\n它定义了挤出体积流量（mm³/s）随时间变化的最大速率。更高的值意味着允许更高的挤出速率变化，从而产生更快速的过渡。\n\n值为0将禁用该功能。\n\n对于高速、高流量的近程挤出机（如Bambu或Voron）通常不需要该值。但是，在特征速度变化很大的某些情况下，它可以提供一些边际收益。例如，当由于悬垂而出现严重的减速时。在这些情况下，建议使用一个大的值大约300-350 mm³/s²的，因为这刚好允许足够的平滑，以帮助压力提前实现更平滑的流量过渡。\n\n对于没有压力提前的较慢打印机，该值应该设置得非常低。对于近程挤出机来说10-15 mm³/s²是一个很好值的起点，而对于远程挤出机来说是5-10 mm³/s²。\n\n这个功能在Prusa切片机中被称为压力均衡器。\n\n注意：此参数禁用圆弧拟合。"
    sidetext:
      text: "mm³/s²"
  max_volumetric_extrusion_rate_slope_segment_length:
    label:
      text: "Smoothing segment length"
      zh_CN: "平滑段长度"
    tooltip:
      text: "A lower value results in smoother extrusion rate transitions. However, this results in a significantly larger G-code file and more instructions for the printer to process.\n\nDefault value of 3 works well for most cases. If your printer is stuttering, increase this value to reduce the number of adjustments made.\n\nAllowed values: 0.5-5"
    sidetext:
      text: "mm"
  extrusion_rate_smoothing_external_perimeter_only:
    label:
      text: "Apply only on external features"
      zh_CN: "仅应用于外部特征"
    tooltip:
      text: "Applies extrusion rate smoothing only on external perimeters and overhangs. This can help reduce artefacts due to sharp speed transitions on externally visible overhangs without impacting the print speed of features that will not be visible to the user."
  enable_support:
    label:
