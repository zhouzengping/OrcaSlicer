    tooltip:
      text: "Jerk of travel moves on the first layer. If expressed as a percentage it will be calculated based on the travel jerk. A value of 0 means the printer will use its firmware default."
      zh_CN: "首层空驶移动的抖动。如果以百分比（如 50%）表示，将基于空驶抖动计算。设为 0 表示使用打印机固件默认值。"
