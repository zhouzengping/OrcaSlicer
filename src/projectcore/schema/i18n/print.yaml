    label:
      text: "Max speed"
      zh_CN: "最大速度"
    tooltip:
      text: "The maximum printing speed on the prime tower excluding ramming."
      zh_CN: "擦料塔上除了预冲刷外的最大打印速度。"
    sidetext:
      text: "mm/s"
  wipe_tower_wall_type:
    label:
      text: "Wall type"
      zh_CN: "墙体类型"
    tooltip:
      text: "Wipe tower outer wall type.\n1. Rectangle: The default wall type, a rectangle with fixed width and height.\n2. Cone: A cone with a fillet at the bottom to help stabilize the wipe tower.\n3. Rib: Adds four ribs to the tower wall for enhanced stability."
      zh_CN: "擦拭塔外墙类型。\n1. 矩形：默认墙体类型，具有固定宽度和高度的矩形。\n2. 圆锥：底部有圆角的圆锥，有助于稳定擦拭塔。\n3. 加强筋：在塔壁上增加四个加强筋以提高稳定性。"
    enum_labels:
      - text: "Rectangle"
        zh_CN: "矩形"
      - text: "Cone"
        zh_CN: "锥体"
      - text: "Rib"
  wipe_tower_cone_angle:
    label:
      text: "Stabilization cone apex angle"
      zh_CN: "稳定锥体顶角"
    tooltip:
      text: "Angle at the apex of the cone that is used to stabilize the wipe tower. Larger angle means wider base."
      zh_CN: "塔锥体顶角的角度，用于稳定擦拭塔。角度越大，底座越宽。"
    sidetext:
      text: "°"
  wipe_tower_extra_rib_length:
    label:
      text: "Extra rib length"
      zh_CN: "额外加强筋长度"
    tooltip:
      text: "Positive values can increase the size of the rib wall, while negative values can reduce the size. However, the size of the rib wall can not be smaller than that determined by the cleaning volume."
      zh_CN: "正值可以增加加强筋墙的尺寸，负值可以减小尺寸。但是，加强筋墙的尺寸不能小于由清洁体积决定的尺寸。"
    sidetext:
      text: "mm"
  wipe_tower_rib_width:
    label:
      text: "Rib width"
      zh_CN: "加强筋宽度"
    tooltip:
      text: "Rib width."
      zh_CN: "加强筋宽度。"
    sidetext:
      text: "mm"
  wipe_tower_fillet_wall:
    label:
      text: "Fillet wall"
      zh_CN: "墙体加圆角"
    tooltip:
      text: "The wall of prime tower will fillet."
      zh_CN: "擦料塔的墙壁做倒角处理"
  wipe_tower_no_sparse_layers:
    label:
      text: "No sparse layers (beta)"
      zh_CN: "无稀疏层 （实验）"
    tooltip:
      text: "If enabled, the wipe tower will not be printed on layers with no tool changes. On layers with a tool change, extruder will travel downward to print the wipe tower. User is responsible for ensuring there is no collision with the print."
      zh_CN: "如果启用，将不会在没有换色的层打印擦拭塔。存在换色的层时，挤出机将降低高度打印擦拭塔。用户应该确保不会与打印内容发生冲突。"
  wipe_tower_wall_gap:
    label:
      text: "Wall gap"
      zh_CN: "外墙缺口"
    tooltip:
      text: "Create small gaps in the wipe tower outer wall at tool change entry points. The first extrusion path after a filament change will enter through the gap, leaving the filament blob on the gap edge instead of on the outer wall surface."
      zh_CN: "在擦拭塔外墙换料入口处创建小缺口。换料后的第一条挤出路径将从缺口进入，将料丝残留留在缺口边缘而非外墙表面。"
  prime_tower_enable_framework:
    label:
      text: "Internal ribs"
      zh_CN: "内支撑肋"
    tooltip:
      text: "Enable internal ribs to increase the stability of the prime tower."
      zh_CN: "启用内支撑肋以增强擦料塔的稳定性。"
  enable_tower_interface_features:
    label:
      text: "Enable tower interface features"
      zh_CN: "启用擦拭塔接触层功能"
    tooltip:
      text: "Enable optimized prime tower interface behavior when different materials meet."
      zh_CN: "启用优化后的擦拭塔接触层行为，用于不同耗材丝相遇时。"
  enable_tower_interface_cooldown_during_tower:
    label:
      text: "Cool down from interface boost during prime tower"
      zh_CN: "擦拭塔期间从接触层加速状态冷却"
    tooltip:
      text: "When interface-layer temperature boost is active, set the nozzle back to print temperature at the start of the prime tower so it cools down during the tower."
      zh_CN: "当接触层温度提升处于活动状态时，在擦拭塔开始时将喷嘴温度恢复到打印温度，以便在打印塔期间降温。"
  single_extruder_multi_material_priming:
    label:
      text: "Prime all printing extruders"
      zh_CN: "所有挤出机画线"
    tooltip:
      text: "If enabled, all printing extruders will be primed at the front edge of the print bed at the start of the print."
      zh_CN: "如果启用，所有挤出机将在打印开始时在床前画线"
  wall_filament:
    label:
      text: "Walls"
      zh_CN: "墙"
    tooltip:
      text: "Filament to print walls."
      zh_CN: "打印外墙的耗材丝"
    category:
      text: "Extruders"
      zh_CN: "挤出机"
  sparse_infill_filament:
    label:
      text: "Infill"
      zh_CN: "填充"
    tooltip:
      text: "Filament to print internal sparse infill."
      zh_CN: "打印内部稀疏填充的耗材丝"
    category:
      text: "Extruders"
      zh_CN: "挤出机"
  solid_infill_filament:
    label:
      text: "Solid infill"
      zh_CN: "实心填充"
    tooltip:
      text: "Filament to print solid infill."
      zh_CN: "打印实心填充的耗材丝。"
    category:
      text: "Extruders"
      zh_CN: "挤出机"
  wipe_tower_filament:
    label:
      text: "Wipe tower"
      zh_CN: "色塔"
    tooltip:
      text: "The extruder to use when printing perimeter of the wipe tower. Set to 0 to use the one that is available (non-soluble would be preferred)."
      zh_CN: "打印擦拭塔周长时使用的挤出机。设置为0将使用唯一的挤出机（尽量使用不可溶的材料）。"
    category:
      text: "Extruders"
      zh_CN: "挤出机"
  ooze_prevention:
    label:
      text: "Enable"
      zh_CN: "开启"
    tooltip:
      text: "This option will drop the temperature of the inactive extruders to prevent oozing."
      zh_CN: "此选项将降低非活动挤出机的温度，以防止渗出。"
  standby_temperature_delta:
    label:
      text: "Temperature variation"
      zh_CN: "软化温度"
    tooltip:
      text: "Temperature difference to be applied when an extruder is not active. The value is not used when 'idle_temperature' in filament settings is set to non-zero value."
    sidetext:
      text: "∆\\u2103"
  preheat_time:
    label:
      text: "Preheat time"
      zh_CN: "预热时间"
    tooltip:
      text: "To reduce the waiting time after tool change, Orca can preheat the next tool while the current tool is still in use. This setting specifies the time in seconds to preheat the next tool. Orca will insert a M104 command to preheat the tool in advance."
    sidetext:
      text: "s"
  preheat_steps:
    label:
      text: "Preheat steps"
      zh_CN: "预热步骤"
    tooltip:
      text: "Insert multiple preheat commands (e.g. M104.1). Only useful for Prusa XL. For other printers, please set it to 1."
  delta_temperature:
    label:
      text: "Preheat delta temperature"
    tooltip:
      text: "Allow user to set the Preheat temperature. If target temperature is 220 and Preheat delta temperature is -30, then the preheat temperature will be 190"
    sidetext:
      text: "∆°C"
  flush_into_infill:
    label:
      text: "Flush into objects' infill"
      zh_CN: "冲刷到对象的填充"
    tooltip:
      text: "Purging after filament change will be done inside objects' infills. This may lower the amount of waste and decrease the print time. If the walls are printed with transparent filament, the mixed color infill will be seen outside. It will not take effect, unless the prime tower is enabled."
      zh_CN: "换料后的过渡料会被用来打印对象的填充。这样可以减少材料浪费和缩短打印时间，但是如果对象的内外墙是采用透明材料打印的，则可以从模型外观上看到内部的混色过渡料。该功能只有在启用料塔的时候才生效。"
    category:
      text: "Flush options"
      zh_CN: "换料冲刷选项"
  flush_into_objects:
    label:
      text: "Flush into this object"
      zh_CN: "冲刷到这个对象"
    tooltip:
      text: "This object will be used to purge the nozzle after a filament change to save filament and decrease the print time. Colors of the objects will be mixed as a result. It will not take effect unless the prime tower is enabled."
      zh_CN: "换料后的过渡料会被用来打印这个对象。这样可以减少材料浪费和缩短打印时间，但是这个对象的外观会是混色的。该功能只有在启用料塔的时候才生效。"
    category:
      text: "Flush options"
      zh_CN: "换料冲刷选项"
  flush_into_support:
    label:
      text: "Flush into objects' support"
      zh_CN: "冲刷到对象的支撑"
    tooltip:
      text: "Purging after filament change will be done inside objects' support. This may lower the amount of waste and decrease the print time. It will not take effect, unless the prime tower is enabled."
      zh_CN: "换料后的过渡料会被用来打印对象的支撑。这样可以减少材料浪费以及缩短打印时间。该功能只有在启用料塔的时候才生效。"
    category:
      text: "Flush options"
      zh_CN: "换料冲刷选项"
  interlocking_beam:
    label:
      text: "Use beam interlocking"
      zh_CN: "启用互锁梁"
    tooltip:
      text: "Generate interlocking beam structure at the locations where different filaments touch. This improves the adhesion between filaments, especially models printed in different materials."
      zh_CN: "在不同耗材接触的位置生成互锁梁结构。这改善了耗材之间的粘合性，特别是使用不同材料打印的模型。"
    category:
      text: "Advanced"
      zh_CN: "高级"
  interface_shells:
    label:
      text: "Interface shells"
      zh_CN: "接触面外壳"
    tooltip:
      text: "Force the generation of solid shells between adjacent materials/volumes. Useful for multi-extruder prints with translucent materials or manual soluble support material."
      zh_CN: "强制在相邻材料/体积之间生成实心壳。适用于使用半透明材料或手动可溶性支撑材料的多挤出机打印"
    category:
      text: "Quality"
      zh_CN: "质量"
  mmu_segmented_region_max_width:
    label:
      text: "Maximum width of a segmented region"
      zh_CN: "分段区域的最大宽度"
    tooltip:
      text: "Maximum width of a segmented region. Zero disables this feature."
      zh_CN: "分段区域的最大宽度。将其设置为零会禁用此功能。"
    sidetext:
      text: "mm"
    category:
      text: "Advanced"
      zh_CN: "高级"
  mmu_segmented_region_interlocking_depth:
    label:
      text: "Interlocking depth of a segmented region"
      zh_CN: "分割区域的交错深度"
    tooltip:
      text: "Interlocking depth of a segmented region. It will be ignored if \"mmu_segmented_region_max_width\" is zero or if \"mmu_segmented_region_interlocking_depth\" is bigger than \"mmu_segmented_region_max_width\". Zero disables this feature."
      zh_CN: "分割区域的交错深度。如果\"mmu_segmented_region_max_width\"为零或\"mmu_segmented_region_interlocking_depth\"大于\"mmu_segmented_region_max_width\"，则将被忽略。零将禁用此功能。"
    sidetext:
      text: "mm"
    category:
      text: "Advanced"
      zh_CN: "高级"
  interlocking_beam_width:
    label:
      text: "Interlocking beam width"
      zh_CN: "互锁梁宽度"
    tooltip:
      text: "The width of the interlocking structure beams."
      zh_CN: "互锁梁的宽度"
    sidetext:
      text: "mm"
    category:
      text: "Advanced"
      zh_CN: "高级"
  interlocking_orientation:
    label:
      text: "Interlocking direction"
      zh_CN: "互锁方向"
    tooltip:
      text: "Orientation of interlock beams."
      zh_CN: "互锁梁的方向"
    sidetext:
      text: "°"
    category:
      text: "Advanced"
      zh_CN: "高级"
  interlocking_beam_layer_count:
    label:
      text: "Interlocking beam layers"
      zh_CN: "互锁梁层数"
    tooltip:
      text: "The height of the beams of the interlocking structure, measured in number of layers. Less layers is stronger, but more prone to defects."
      zh_CN: "互锁结构梁的高度，以层数为单位。较少的层更强，但更容易出现缺陷。"
    category:
      text: "Advanced"
      zh_CN: "高级"
  interlocking_depth:
    label:
      text: "Interlocking depth"
      zh_CN: "互锁深度"
    tooltip:
      text: "The distance from the boundary between filaments to generate interlocking structure, measured in cells. Too few cells will result in poor adhesion."
      zh_CN: "从耗材边界生成互锁结构的距离，以单元格为单位。太少的单元格将导致粘合不良。"
    category:
      text: "Advanced"
      zh_CN: "高级"
  interlocking_boundary_avoidance:
    label:
      text: "Interlocking boundary avoidance"
      zh_CN: "互锁与边界的留白量"
    tooltip:
      text: "The distance from the outside of a model where interlocking structures will not be generated, measured in cells."
      zh_CN: "模型边框与互锁结构的距离，以单元格为单位。"
    category:
      text: "Advanced"
      zh_CN: "高级"
  dithering_local_z_mode:
    label:
      text: "Subdivide Mix Layer"
      zh_CN: "混色细分层高"
    tooltip:
      text: "Enable \"Subdivide Mix Layer\" for mixing areas. Layer height will be subdivided for better color mixing results."
      zh_CN: "启用混色区域独立层高。启用后，使用混色区域的层高将被细分，以实现更好混色效果。"
    category:
      text: "Material"
  dithering_local_z_whole_objects:
    label:
      text: "Full domain"
      zh_CN: "全域生效"
    tooltip:
      text: "Experimental. Apply Local-Z thinning across whole mixed-color regions instead of limiting the effect strictly to painted mixed masks.\n\nOnly available when Subdivide Mix Layer is enabled."
    category:
      text: "Others"
      zh_CN: "其他"
  dithering_local_z_infill:
    label:
      text: "Apply subdivision to infill"
      zh_CN: "应用到填充"
    tooltip:
      text: "Experimental. When Subdivide Mix Layer is enabled, also apply the same subdivision to infill inside mixed-color areas.\n\nThis is enabled automatically with Subdivide Mix Layer. Turn it off to keep infill on the normal layer height.\n\nIt can improve internal color mixing, but may add toolchanges and affect infill behavior."
    category:
      text: "Material"
  skirt_loops:
    label:
      text: "Skirt loops"
      zh_CN: "Skirt圈数"
    full_label:
      text: "Skirt loops"
      zh_CN: "Skirt圈数"
    tooltip:
      text: "Number of loops for the skirt. Zero means disabling skirt."
      zh_CN: "skirt的圈数。0表示关闭skirt。"
  skirt_type:
    label:
      text: "Skirt type"
      zh_CN: "Skirt类型"
    full_label:
      text: "Skirt type"
      zh_CN: "Skirt类型"
    tooltip:
      text: "Combined - single skirt for all objects, Per object - individual object skirt."
      zh_CN: "合并 - 所有对象共用一个skirt，Per object - 每个对象单独的skirt。"
    enum_labels:
      - text: "Combined"
        zh_CN: "合并"
      - text: "Per object"
        zh_CN: "按对象"
  min_skirt_length:
    label:
      text: "Skirt minimum extrusion length"
      zh_CN: "Skirt最小挤出长度"
    full_label:
      text: "Skirt minimum extrusion length"
      zh_CN: "Skirt最小挤出长度"
    tooltip:
      text: "Minimum filament extrusion length in mm when printing the skirt. Zero means this feature is disabled.\n\nUsing a non-zero value is useful if the printer is set up to print without a prime line.\nFinal number of loops is not taking into account while arranging or validating objects distance. Increase loop number in such case."
      zh_CN: "打印裙边时的最小耗材挤出长度，单位为毫米。0表示禁用此功能。\n\n如果打印机设置为不打印起始擦嘴线，建议使用非零值。\n在排列或验证物体距离时，最终的圈数不会被纳入计算。在这种情况下请增加圈数。"
    sidetext:
      text: "mm"
  skirt_distance:
    label:
      text: "Skirt distance"
      zh_CN: "Skirt距离"
    tooltip:
      text: "The distance from the skirt to the brim or the object."
      zh_CN: "从skirt到模型或者brim的距离"
    sidetext:
      text: "mm"
  skirt_start_angle:
    label:
      text: "Skirt start point"
      zh_CN: "Skirt起始点"
    tooltip:
      text: "Angle from the object center to skirt start point. Zero is the most right position, counter clockwise is positive angle."
      zh_CN: "从模型中心到skirt起始点的角度。0是最右边的位置，逆时针是正角度。"
    sidetext:
      text: "°"
  skirt_speed:
    label:
      text: "Skirt speed"
      zh_CN: "Skirt速度"
    full_label:
      text: "Skirt speed"
      zh_CN: "Skirt速度"
    tooltip:
      text: "Speed of skirt, in mm/s. Zero means use default layer extrusion speed."
      zh_CN: "skirt速度，单位为mm/s。0表示使用默认的层挤出速度。"
    sidetext:
      text: "mm/s"
  skirt_height:
    label:
      text: "Skirt height"
      zh_CN: "Skirt高度"
    tooltip:
      text: "How many layers of skirt. Usually only one layer."
      zh_CN: "skirt有多少层。通常只有一层"
    sidetext:
      text: "layers"
      zh_CN: "层"
  draft_shield:
    label:
      text: "Draft shield"
      zh_CN: "风挡"
    tooltip:
      text: "A draft shield is useful to protect an ABS or ASA print from warping and detaching from print bed due to wind draft. It is usually needed only with open frame printers, i.e. without an enclosure.\n\nEnabled = skirt is as tall as the highest printed object. Otherwise 'Skirt height' is used.\nNote: With the draft shield active, the skirt will be printed at skirt distance from the object. Therefore, if brims are active it may intersect with them. To avoid this, increase the skirt distance value.\n"
      zh_CN: "风挡对于保护ABS或ASA打印件免受风力的影响，防止翘曲和从打印床上脱落是非常有用的。通常只有在没有封箱的开放式打印机上才需要。\n\n启用 = skirt的高度与最高的打印对象一样高。否则的话会使用'skirt高度'。\n注意：启用风挡后，skirt将会在距离模型'skirt距离'的地方打印。因此，如果brim启用，可能会与其相交。为了避免这种情况，增加skirt距离值。\n"
    enum_labels:
      - text: "Disabled"
        zh_CN: "禁用"
      - text: "Enabled"
        zh_CN: "启用"
  single_loop_draft_shield:
    label:
      text: "Single loop after first layer"
      zh_CN: "首层后单圈"
    tooltip:
      text: "Limits the skirt/draft shield loops to one wall after the first layer. This is useful, on occasion, to conserve filament but may cause the draft shield/skirt to warp / crack."
  brim_type:
    label:
      text: "Brim type"
      zh_CN: "Brim类型"
    tooltip:
      text: "This controls the generation of the brim at outer and/or inner side of models. Auto means the brim width is analyzed and calculated automatically."
      zh_CN: "该参数控制在模型的外侧和/或内侧生成brim。自动是指自动分析和计算边框的宽度。"
    category:
      text: "Support"
      zh_CN: "支撑"
    enum_labels:
      - text: "Auto"
        zh_CN: "自动"
      - text: "Mouse ear"
        zh_CN: "圆盘"
      - text: "Painted"
        zh_CN: "绘制"
      - text: "Outer brim only"
        zh_CN: "仅外侧"
      - text: "Inner brim only"
        zh_CN: "仅内侧"
      - text: "Outer and inner brim"
        zh_CN: "内侧和外侧"
      - text: "No-brim"
        zh_CN: "无brim"
  brim_width:
    label:
      text: "Brim width"
      zh_CN: "Brim宽度"
    tooltip:
      text: "Distance from model to the outermost brim line."
      zh_CN: "从模型到最外圈brim走线的距离"
    sidetext:
      text: "mm"
    category:
      text: "Support"
      zh_CN: "支撑"
  brim_object_gap:
    label:
      text: "Brim-object gap"
      zh_CN: "Brim与模型的间隙"
    tooltip:
      text: "A gap between innermost brim line and object can make brim be removed more easily."
      zh_CN: "在brim和模型之间设置间隙，能够让brim更容易剥离"
    sidetext:
      text: "mm"
    category:
      text: "Support"
      zh_CN: "支撑"
  brim_ears_max_angle:
    label:
      text: "Brim ear max angle"
      zh_CN: "圆盘最大角度"
    tooltip:
      text: "Maximum angle to let a brim ear appear.\nIf set to 0, no brim will be created.\nIf set to ~180, brim will be created on everything but straight sections."
      zh_CN: "让圆盘出现的最大角度。\n如果设置为0，则不会创建圆盘。\n如果设置为约180，除直线部分外，其他部分都会创建圆盘。"
    sidetext:
      text: "°"
    category:
      text: "Support"
      zh_CN: "支撑"
  brim_ears_detection_length:
    label:
      text: "Brim ear detection radius"
      zh_CN: "圆盘检测半径"
    tooltip:
      text: "The geometry will be decimated before detecting sharp angles. This parameter indicates the minimum length of the deviation for the decimation.\n0 to deactivate."
      zh_CN: "在检测尖锐角度之前，几何形状将被简化。此参数表示简化的最小偏差长度。\n设为0以停用"
    sidetext:
      text: "mm"
    category:
      text: "Support"
      zh_CN: "支撑"
  slicing_mode:
    label:
      text: "Slicing Mode"
      zh_CN: "切片模式"
    tooltip:
      text: "Use \"Even-odd\" for 3DLabPrint airplane models. Use \"Close holes\" to close all holes in the model."
      zh_CN: "对3DLabPrint的飞机模型使用 \"奇偶\"。使用 \"闭孔 \"来关闭模型上的所有孔。"
    category:
      text: "Other"
      zh_CN: "其他"
    enum_labels:
      - text: "Regular"
        zh_CN: "常规"
      - text: "Even-odd"
        zh_CN: "奇偶"
      - text: "Close holes"
        zh_CN: "闭孔"
  print_sequence:
    label:
      text: "Print sequence"
      zh_CN: "打印顺序"
    tooltip:
      text: "Print sequence, layer by layer or object by object."
      zh_CN: "打印顺序，逐层打印或者逐件打印"
    enum_labels:
      - text: "By layer"
        zh_CN: "逐层"
      - text: "By object"
        zh_CN: "逐件"
  print_order:
    label:
      text: "Intra-layer order"
      zh_CN: "层内打印顺序"
    tooltip:
      text: "Print order within a single layer."
      zh_CN: "同一层内的打印顺序"
    enum_labels:
      - text: "Default"
        zh_CN: "缺省"
      - text: "As object list"
        zh_CN: "按对象列表中的顺序"
  spiral_mode:
    label:
      text: "Spiral vase"
      zh_CN: "旋转花瓶"
    tooltip:
      text: "Spiralize smooths out the z moves of the outer contour. And turns a solid model into a single walled print with solid bottom layers. The final generated model has no seam."
      zh_CN: "沿着对象的外轮廓螺旋上升，将实体模型转变为只有底面实心层和侧面单层墙壁的打印。最后生成的打印件没有接缝。"
  spiral_mode_smooth:
    label:
      text: "Smooth Spiral"
      zh_CN: "光滑螺旋模式"
    tooltip:
      text: "Smooth Spiral smooths out X and Y moves as well, resulting in no visible seam at all, even in the XY directions on walls that are not vertical."
      zh_CN: "光滑螺旋模式平滑X和Y轴移动，从而在所有方向上都没有可见的接缝，即使在不垂直的墙壁上也是如此。"
  spiral_mode_max_xy_smoothing:
    label:
      text: "Max XY Smoothing"
      zh_CN: "最大XY平滑阈值"
    tooltip:
      text: "Maximum distance to move points in XY to try to achieve a smooth spiral. If expressed as a %, it will be computed over nozzle diameter."
      zh_CN: "在XY平面上移动点的最大距离，以尝试实现平滑的螺旋。如果以%表示，它将基于喷嘴直径来计算。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
  spiral_starting_flow_ratio:
    label:
      text: "Spiral starting flow ratio"
      zh_CN: "螺旋开始流量比"
    tooltip:
      text: "Sets the starting flow ratio while transitioning from the last bottom layer to the spiral. Normally the spiral transition scales the flow ratio from 0% to 100% during the first loop which can in some cases lead to under extrusion at the start of the spiral."
  spiral_finishing_flow_ratio:
    label:
      text: "Spiral finishing flow ratio"
      zh_CN: "螺旋结束流量比"
    tooltip:
      text: "Sets the finishing flow ratio while ending the spiral. Normally the spiral transition scales the flow ratio from 100% to 0% during the last loop which can in some cases lead to under extrusion at the end of the spiral."
  timelapse_type:
    label:
      text: "Timelapse"
      zh_CN: "延时摄影"
    tooltip:
      text: "If smooth or traditional mode is selected, a timelapse video will be generated for each print. After each layer is printed, a snapshot is taken with the chamber camera. All of these snapshots are composed into a timelapse video when printing completes. If smooth mode is selected, the toolhead will move to the excess chute after each layer is printed and then take a snapshot. Since the melt filament may leak from the nozzle during the process of taking a snapshot, prime tower is required for smooth mode to wipe nozzle."
      zh_CN: "如果启用平滑模式或者传统模式，将在每次打印时生成延时摄影视频。打印完每层后，将用内置相机拍摄快照。打印完成后，所有这些快照会组合成一个延时视频。如果启用平滑模式，打印完每层后，工具头将移动到吐料槽，然后拍摄快照。由于平滑模式在拍摄快照的过程中熔丝可能会从喷嘴中泄漏，因此需要使用擦拭塔进行喷嘴擦拭。"
    enum_labels:
      - text: "Traditional"
        zh_CN: "传统模式"
      - text: "Smooth"
        zh_CN: "平滑模式"
  fuzzy_skin:
    label:
      text: "Fuzzy Skin"
      zh_CN: "绒毛表面"
    tooltip:
      text: "Randomly jitter while printing the wall, so that the surface has a rough look. This setting controls the fuzzy position."
      zh_CN: "打印外墙时随机抖动，使外表面产生绒效果。这个设置决定适用的位置。"
    category:
      text: "Others"
      zh_CN: "其他"
    enum_labels:
      - text: "None"
        zh_CN: "无"
      - text: "Contour"
        zh_CN: "轮廓"
      - text: "Contour and hole"
        zh_CN: "轮廓和孔"
      - text: "All walls"
        zh_CN: "所有墙"
  fuzzy_skin_mode:
    label:
      text: "Fuzzy skin generator mode"
      zh_CN: "绒毛表面生成器模式"
    tooltip:
      text: "Fuzzy skin generation mode. Works only with Arachne!\nDisplacement: Сlassic mode when the pattern is formed by shifting the nozzle sideways from the original path.\nExtrusion: The mode when the pattern formed by the amount of extruded plastic. This is the fast and straight algorithm without unnecessary nozzle shake that gives a smooth pattern. But it is more useful for forming loose walls in the entire they array.\nCombined: Joint mode [Displacement] + [Extrusion]. The appearance of the walls is similar to [Displacement] Mode, but it leaves no pores between the perimeters.\n\nAttention! The [Extrusion] and [Combined] modes works only the fuzzy_skin_thickness parameter not more than the thickness of printed loop. At the same time, the width of the extrusion for a particular layer should also not be below a certain level. It is usually equal 15-25%% of a layer height. Therefore, the maximum fuzzy skin thickness with a perimeter width of 0.4 mm and a layer height of 0.2 mm will be 0.4-(0.2*0.25)=±0.35mm! If you enter a higher parameter than this, the error Flow::spacing() will displayed, and the model will not be sliced. You can choose this number until this error is repeated."
    category:
      text: "Others"
      zh_CN: "其他"
    enum_labels:
      - text: "Displacement"
        zh_CN: "位移"
      - text: "Extrusion"
        zh_CN: "挤出"
      - text: "Combined"
        zh_CN: "合并"
  fuzzy_skin_noise_type:
    label:
      text: "Fuzzy skin noise type"
      zh_CN: "绒毛噪声类型"
    tooltip:
      text: "Noise type to use for fuzzy skin generation:\nClassic: Classic uniform random noise.\nPerlin: Perlin noise, which gives a more consistent texture.\nBillow: Similar to perlin noise, but clumpier.\nRidged Multifractal: Ridged noise with sharp, jagged features. Creates marble-like textures.\nVoronoi: Divides the surface into voronoi cells, and displaces each one by a random amount. Creates a patchwork texture."
      zh_CN: "用于生成绒毛效果的噪声类型。\n经典: 经典的均匀随机噪声。\n柏林噪声: 能产生更均匀纹理的柏林噪声。\n云状噪声: 类似柏林噪声，但更聚集。\n脊状多重分形: 具有锋利锯齿特性的脊状噪声，呈现大理石般纹理。\n维诺图: 将表面划分为维诺单元，每个单元依随机量位移，形成拼贴纹理。"
    category:
      text: "Others"
      zh_CN: "其他"
    enum_labels:
      - text: "Classic"
        zh_CN: "经典"
      - text: "Perlin"
        zh_CN: "柏林噪声"
      - text: "Billow"
        zh_CN: "云状噪声"
      - text: "Ridged Multifractal"
        zh_CN: "脊状多重分形"
      - text: "Voronoi"
        zh_CN: "维诺图"
  fuzzy_skin_point_distance:
    label:
      text: "Fuzzy skin point distance"
      zh_CN: "绒毛表面点间距"
    tooltip:
      text: "The average distance between the random points introduced on each line segment."
      zh_CN: "产生绒毛表面时，插入的随机点之间的平均距离"
    sidetext:
      text: "mm"
    category:
      text: "Others"
      zh_CN: "其他"
  fuzzy_skin_thickness:
    label:
      text: "Fuzzy skin thickness"
      zh_CN: "绒毛表面厚度"
    tooltip:
      text: "The width within which to jitter. It's advised to be below outer wall line width."
      zh_CN: "产生绒毛的抖动的宽度。建议小于外圈墙的线宽。"
    sidetext:
      text: "mm"
    category:
      text: "Others"
      zh_CN: "其他"
  fuzzy_skin_scale:
    label:
      text: "Fuzzy skin feature size"
      zh_CN: "绒毛表面特征尺寸"
    tooltip:
      text: "The base size of the coherent noise features, in mm. Higher values will result in larger features."
      zh_CN: "相干噪声特征的基础尺寸（单位：毫米）。较高的数值会产生更大的特征。"
    sidetext:
      text: "mm"
    category:
      text: "Others"
      zh_CN: "其他"
  fuzzy_skin_octaves:
    label:
      text: "Fuzzy Skin Noise Octaves"
      zh_CN: "绒毛噪声倍频"
    tooltip:
      text: "The number of octaves of coherent noise to use. Higher values increase the detail of the noise, but also increase computation time."
      zh_CN: "使用的相干噪声倍频数。较高的数值会增加噪声细节，但也会增加计算时间。"
    category:
      text: "Others"
      zh_CN: "其他"
  fuzzy_skin_persistence:
    label:
      text: "Fuzzy skin noise persistence"
      zh_CN: "绒毛噪声持续性"
    tooltip:
      text: "The decay rate for higher octaves of the coherent noise. Lower values will result in smoother noise."
      zh_CN: "相干噪声高倍频的衰减速率。较低的数值会产生更平滑的噪声。"
    category:
      text: "Others"
      zh_CN: "其他"
  fuzzy_skin_first_layer:
    label:
      text: "Apply fuzzy skin to first layer"
      zh_CN: "绒毛表面应用至首层"
    tooltip:
      text: "Whether to apply fuzzy skin on the first layer."
      zh_CN: "是否在第一层应用绒毛效果"
    category:
      text: "Others"
      zh_CN: "其他"
  reduce_infill_retraction:
    label:
      text: "Reduce infill retraction"
      zh_CN: "减小填充回抽"
    tooltip:
      text: "Don't retract when the travel is in infill area absolutely. That means the oozing can't been seen. This can reduce times of retraction for complex model and save printing time, but make slicing and G-code generating slower."
      zh_CN: "当空驶完全在填充区域内时不触发回抽。这意味着即使漏料也是不可见的。对于复杂模型，该设置能够减少回抽次数以及打印时长，但是会造成G-code生成变慢"
  gcode_add_line_number:
    label:
      text: "Add line number"
      zh_CN: "标注行号"
    tooltip:
      text: "Enable this to add line number(Nx) at the beginning of each G-code line."
      zh_CN: "启用该设置，G-code的每一行的开头会增加Nx标注行号。"
  gcode_comments:
    label:
      text: "Verbose G-code"
      zh_CN: "注释G-code"
    tooltip:
      text: "Enable this to get a commented G-code file, with each line explained by a descriptive text. If you print from SD card, the additional weight of the file could make your firmware slow down."
      zh_CN: "启用此选项，将获得带有注释的G-code文件，每行都有描述性文本解释。如果您从SD卡打印，文件的额外重量可能会使您的固件变慢。"
  gcode_label_objects:
    label:
      text: "Label objects"
      zh_CN: "标注模型"
    tooltip:
      text: "Enable this to add comments into the G-code labeling print moves with what object they belong to, which is useful for the Octoprint CancelObject plugin. This settings is NOT compatible with Single Extruder Multi Material setup and Wipe into Object / Wipe into Infill."
      zh_CN: "启用此选项，将在G-code中添加注释，标记打印移动属于哪个对象，这对Octoprint CancelObject插件非常有用。此设置与单挤出机多材料设置和擦拭到对象/擦拭到填充不兼容。"
  exclude_object:
    label:
      text: "Exclude objects"
      zh_CN: "对象排除"
    tooltip:
      text: "Enable this option to add EXCLUDE OBJECT command in G-code."
      zh_CN: "启用此选项以在G-code中添加EXCLUDE OBJECT命令。"
  filename_format:
    label:
      text: "Filename format"
      zh_CN: "文件名格式"
    tooltip:
      text: "Users can define the project file name when exporting."
      zh_CN: "用户可以自定义导出项目文件的名称。"
  post_process:
    label:
      text: "Post-processing Scripts"
      zh_CN: "后处理脚本"
    tooltip:
      text: "If you want to process the output G-code through custom scripts, just list their absolute paths here. Separate multiple scripts with a semicolon. Scripts will be passed the absolute path to the G-code file as the first argument, and they can access the Snapmaker Orca config settings by reading environment variables."
      zh_CN: "如果您希望使用自定义脚本来处理输出的 G-code，只需要在此列出这些脚本的绝对路径，使用分号来分割多个脚本。脚本执行的第一个参数将会被设置为 G-code 文件的绝对路径，并支持脚本通过全局变量来读取 Snapmaker Orca 的设置。"
  notes:
    label:
      text: "Configuration notes"
      zh_CN: "配置注释"
    tooltip:
      text: "You can put here your personal notes. This text will be added to the G-code header comments."
      zh_CN: "你可以把你的个人注释放在这里。该文本将添加到G-code首部注释中。"
