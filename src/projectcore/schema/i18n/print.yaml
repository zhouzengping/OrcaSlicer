  slowdown_for_curled_perimeters:
    label:
      text: "Slow down for curled perimeters"
      zh_CN: "翘边降速"
    tooltip:
      text: "Enable this option to slow down printing in areas where perimeters may have curled upwards. For example, additional slowdown will be applied when printing overhangs on sharp corners like the front of the Benchy hull, reducing curling which compounds over multiple layers.\n\nIt is generally recommended to have this option switched on unless your printer cooling is powerful enough or the print speed slow enough that perimeter curling does not happen. If printing with a high external perimeter speed, this parameter may introduce slight artifacts when slowing down due to the large variance in print speeds. If you notice artifacts, ensure your pressure advance is tuned correctly.\n\nNote: When this option is enabled, overhang perimeters are treated like overhangs, meaning the overhang speed is applied even if the overhanging perimeter is part of a bridge. For example, when the perimeters are 100% overhanging, with no wall supporting them from underneath, the 100% overhang speed will be applied."
      zh_CN: "启用此选项以降低可能向上翘曲的周长区域的打印速度。例如，在打印Benchy船体前部等尖锐角落的悬垂时，将应用额外的减速，减少在多层中复合的翘曲。\n\n通常建议启用此选项，除非您的打印机冷却足够强大或打印速度足够慢，以至于周长翘曲不会发生。如果以较高的外部周长速度打印，由于打印速度的巨大差异，此参数在减速时可能会引入轻微的伪影。如果您注意到伪影，请确保您的压力提前已正确调整。\n\n注意：启用此选项时，悬垂周长将被视为悬垂，这意味着即使悬垂周长是桥接的一部分，也会应用悬垂速度。例如，当周长100%悬垂，没有墙壁从下方支撑时，将应用100%悬垂速度。"
    category:
      text: "Speed"
      zh_CN: "速度"
