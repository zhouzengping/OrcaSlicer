# Generated by src/projectcore/schema/script/generate_schema.py -- do not edit by hand
# 展示层：每个 key 的源码原文 + 已有翻译。结构与语义在主 YAML，
# 一切「显示什么、翻译成什么」在这里。单个 key 的完整字段示例
# （合成全部展示字段，实际 key 只带其中子集）：
#   example_key:
#     label:                  # 主标签（选项行标题）
#       text: "Layer height"  # 源码原文（L() 的 msgid），永远存在
#       zh_CN: "层高"         # 有译文才出现该语言键；缺失 = 回落 text
#     full_label:             # 完整标签（对象设置面板等空间充裕处）
#       text: "..."
#     tooltip:                # 悬浮提示
#       text: "..."
#     sidetext:               # 行内单位/短后缀（mm、% 等，多为源码裸串无翻译）
#       text: "mm"
#     category:               # 搜索/归类的分类名
#       text: "Strength"
#     enum_labels:            # 枚举选项标签数组，与主 YAML 的 values 按下标平行
#       - text: "Auto"        # values[i] 显示为 enum_labels[i]，长度相等可 zip
#         zh_CN: "自动"
# 文件末尾 tabs:/groups: 节收录 tab/组显示名，{text, 语言} 结构同上
# （hidden.yaml 无此二节；Extruder %d 模板名原样保留，运行时格式化编号）。
# 本文件按 key 名访问、无顺序需求，保持 mapping 结构（主 YAML 的顺序
# 由 tabs[].groups[].keys[] 数组承载，两者职责不同）。
version: 0.1.0
keys:
  layer_height:
    label:
      text: "Layer height"
      zh_CN: "层高"
    tooltip:
      text: "Slicing height for each layer. Smaller layer height means more accurate and more printing time."
      zh_CN: "每一层的切片高度。越小的层高意味着更高的精度和更长的打印时间。"
    sidetext:
      text: "mm"
    category:
      text: "Quality"
      zh_CN: "质量"
  initial_layer_print_height:
    label:
      text: "Initial layer height"
      zh_CN: "首层层高"
    tooltip:
      text: "Height of initial layer. Making initial layer height to be thick slightly can improve build plate adhesion."
      zh_CN: "首层层高"
    sidetext:
      text: "mm"
    category:
      text: "Quality"
      zh_CN: "质量"
  line_width:
    label:
      text: "Default"
      zh_CN: "缺省"
    tooltip:
      text: "Default line width if other line widths are set to 0. If expressed as a %, it will be computed over the nozzle diameter."
      zh_CN: "当线宽设置为0时走线的默认线宽。如果以%表示，它将基于喷嘴直径来计算。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  initial_layer_line_width:
    label:
      text: "Initial layer"
      zh_CN: "首层"
    tooltip:
      text: "Line width of initial layer. If expressed as a %, it will be computed over the nozzle diameter."
      zh_CN: "首层的线宽。如果以%表示，它将基于喷嘴直径来计算。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  outer_wall_line_width:
    label:
      text: "Outer wall"
      zh_CN: "外墙"
    tooltip:
      text: "Line width of outer wall. If expressed as a %, it will be computed over the nozzle diameter."
      zh_CN: "外墙的线宽。如果以%表示，它将基于喷嘴直径来计算"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  inner_wall_line_width:
    label:
      text: "Inner wall"
      zh_CN: "内墙"
    tooltip:
      text: "Line width of inner wall. If expressed as a %, it will be computed over the nozzle diameter."
      zh_CN: "内墙的线宽。如果以%表示，它将基于喷嘴直径来计算。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  top_surface_line_width:
    label:
      text: "Top surface"
      zh_CN: "顶面"
    tooltip:
      text: "Line width for top surfaces. If expressed as a %, it will be computed over the nozzle diameter."
      zh_CN: "顶面的线宽。如果以%表示，它将基于喷嘴直径来计算。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  sparse_infill_line_width:
    label:
      text: "Sparse infill"
      zh_CN: "稀疏填充"
    tooltip:
      text: "Line width of internal sparse infill. If expressed as a %, it will be computed over the nozzle diameter."
      zh_CN: "内部稀疏填充的线宽。如果以%表示，它将基于喷嘴直径来计算。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  internal_solid_infill_line_width:
    label:
      text: "Internal solid infill"
      zh_CN: "内部实心填充"
    tooltip:
      text: "Line width of internal solid infill. If expressed as a %, it will be computed over the nozzle diameter."
      zh_CN: "内部实心填充的线宽。如果以%表示，它将基于喷嘴直径来计算。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  support_line_width:
    label:
      text: "Support"
      zh_CN: "支撑"
    tooltip:
      text: "Line width of support. If expressed as a %, it will be computed over the nozzle diameter."
      zh_CN: "支撑的线宽。如果以%表示，它将基于喷嘴直径来计算。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  seam_position:
    label:
      text: "Seam position"
      zh_CN: "接缝位置"
    tooltip:
      text: "The start position to print each part of outer wall."
      zh_CN: "开始打印外墙的位置"
    category:
      text: "Quality"
      zh_CN: "质量"
    enum_labels:
      - text: "Nearest"
        zh_CN: "最近"
      - text: "Aligned"
        zh_CN: "对齐"
      - text: "Aligned back"
        zh_CN: "背部对齐"
      - text: "Back"
        zh_CN: "背面"
      - text: "Random"
        zh_CN: "随机"
  staggered_inner_seams:
    label:
      text: "Staggered inner seams"
      zh_CN: "交错的内墙接缝"
    tooltip:
      text: "This option causes the inner seams to be shifted backwards based on their depth, forming a zigzag pattern."
      zh_CN: "此选项会根据内墙深度使接缝向后移动，形成锯齿形模式。"
  seam_gap:
    label:
      text: "Seam gap"
      zh_CN: "接缝间隔"
    tooltip:
      text: "In order to reduce the visibility of the seam in a closed loop extrusion, the loop is interrupted and shortened by a specified amount.\nThis amount can be specified in millimeters or as a percentage of the current extruder diameter. The default value for this parameter is 10%."
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
  seam_slope_type:
    label:
      text: "Scarf joint seam (beta)"
      zh_CN: "斜拼接缝（试验）"
    tooltip:
      text: "Use scarf joint to minimize seam visibility and increase seam strength."
      zh_CN: "使用斜拼接缝来最小化接缝的可见性并增加接缝的强度。"
    enum_labels:
      - text: "None"
        zh_CN: "无"
      - text: "Contour"
        zh_CN: "轮廓"
      - text: "Contour and hole"
        zh_CN: "轮廓和孔"
  seam_slope_conditional:
    label:
      text: "Conditional scarf joint"
      zh_CN: "选择性应用斜拼接缝"
    tooltip:
      text: "Apply scarf joints only to smooth perimeters where traditional seams do not conceal the seams at sharp corners effectively."
      zh_CN: "当墙壁没有合适的锐角以至于传统接缝无法有效隐藏的时候使用斜拼接缝。"
  scarf_angle_threshold:
    label:
      text: "Conditional angle threshold"
      zh_CN: "角度阈值"
    tooltip:
      text: "This option sets the threshold angle for applying a conditional scarf joint seam.\nIf the maximum angle within the perimeter loop exceeds this value (indicating the absence of sharp corners), a scarf joint seam will be used. The default value is 155°."
      zh_CN: "此选项设置判断是否应用斜拼接缝的角度阈值。\n如果围墙环内的最大角度超过了这个值（表示没有足够锐的角），则使用斜拼接缝接缝。默认值为155°。"
    sidetext:
      text: "°"
  scarf_overhang_threshold:
    label:
      text: "Conditional overhang threshold"
      zh_CN: "悬垂阈值"
    tooltip:
      text: "This option determines the overhang threshold for the application of scarf joint seams. If the unsupported portion of the perimeter is less than this threshold, scarf joint seams will be applied. The default threshold is set at 40% of the external wall's width. Due to performance considerations, the degree of overhang is estimated."
      zh_CN: "此选项设置斜拼接缝应用的悬垂阈值。如果围墙的未支撑部分小于此阈值，则应用斜拼接缝接缝。默认阈值设置为外墙宽度的40%。由于性能考虑，悬垂程度是粗略估算。"
    sidetext:
      text: "%"
    category:
      text: "Quality"
      zh_CN: "质量"
  scarf_joint_speed:
    label:
      text: "Scarf joint speed"
      zh_CN: "斜拼接缝速度"
    tooltip:
      text: "This option sets the printing speed for scarf joints. It is recommended to print scarf joints at a slow speed (less than 100 mm/s). It's also advisable to enable 'Extrusion rate smoothing' if the set speed varies significantly from the speed of the outer or inner walls. If the speed specified here is higher than the speed of the outer or inner walls, the printer will default to the slower of the two speeds. When specified as a percentage (e.g., 80%), the speed is calculated based on the respective outer or inner wall speed. The default value is set to 100%."
      zh_CN: "这个选项设置斜拼接缝的打印速度。建议以较慢的速度（小于100mm/s）打印斜拼接缝。如果设置的速度与外墙或内墙的速度相差较大，建议启用“平滑挤出率”。如果此处指定的速度高于外墙或内墙的速度，则打印机将默认使用两者中较慢的速度。当以百分比（例如80%）指定时，速度将基于外墙或内墙的速度进行计算。默认值为100%。"
    sidetext:
      text: "mm/s or %"
      zh_CN: "mm/s 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  seam_slope_start_height:
    label:
      text: "Scarf start height"
      zh_CN: "斜拼接缝起始高度"
    tooltip:
      text: "Start height of the scarf.\nThis amount can be specified in millimeters or as a percentage of the current layer height. The default value for this parameter is 0."
      zh_CN: "斜拼接缝的起始高度。\n这个数值可以用毫米或者当前层高的百分比表示。默认值为0。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
  seam_slope_entire_loop:
    label:
      text: "Scarf around entire wall"
      zh_CN: "围绕整个围墙"
    tooltip:
      text: "The scarf extends to the entire length of the wall."
      zh_CN: "将斜拼接缝延伸到整个围墙"
  seam_slope_min_length:
    label:
      text: "Scarf length"
      zh_CN: "斜拼接缝长度"
    tooltip:
      text: "Length of the scarf. Setting this parameter to zero effectively disables the scarf."
      zh_CN: "斜拼接缝的长度。长度为0时会禁用斜拼接缝"
    sidetext:
      text: "mm"
  seam_slope_steps:
    label:
      text: "Scarf steps"
      zh_CN: "斜拼段数"
    tooltip:
      text: "Minimum number of segments of each scarf."
      zh_CN: "斜拼接缝所需的最少段数"
  scarf_joint_flow_ratio:
    label:
      text: "Scarf joint flow ratio"
      zh_CN: "斜拼接缝流量"
    tooltip:
      text: "This factor affects the amount of material for scarf joints."
      zh_CN: "这个参数影响斜拼接缝的材料用量。"
  seam_slope_inner_walls:
    label:
      text: "Scarf joint for inner walls"
      zh_CN: "应用斜拼于内墙"
    tooltip:
      text: "Use scarf joint for inner walls as well."
      zh_CN: "同时应用斜拼接缝于内墙"
  role_based_wipe_speed:
    label:
      text: "Role base wipe speed"
      zh_CN: "自动擦拭速度"
    tooltip:
      text: "The wipe speed is determined by the speed of the current extrusion role. e.g. if a wipe action is executed immediately following an outer wall extrusion, the speed of the outer wall extrusion will be utilized for the wipe action."
      zh_CN: "擦拭速度由当前挤出类型的速度决定。例如，如果擦拭动作紧随外墙，擦拭速度将使用外墙的速度。"
  wipe_speed:
    label:
      text: "Wipe speed"
      zh_CN: "擦拭速度"
    tooltip:
      text: "The wipe speed is determined by the speed setting specified in this configuration. If the value is expressed as a percentage (e.g. 80%), it will be calculated based on the travel speed setting above. The default value for this parameter is 80%."
      zh_CN: "擦拭速度是根据此配置中指定的速度设置确定的。如果该值以百分比形式表示（例如80%），则将根据上方的移动速度设置进行计算。该参数的默认值为80%。"
    sidetext:
      text: "mm/s or %"
      zh_CN: "mm/s 或 %"
  wipe_on_loops:
    label:
      text: "Wipe on loops"
      zh_CN: "闭环擦拭"
    tooltip:
      text: "To minimize the visibility of the seam in a closed loop extrusion, a small inward movement is executed before the extruder leaves the loop."
      zh_CN: "为了最大限度地减少闭环挤出中接缝的可见性，在挤出机离开环之前，会向内执行一个小小的移动。"
  wipe_before_external_loop:
    label:
      text: "Wipe before external loop"
      zh_CN: "额外的外墙打印前擦拭"
    tooltip:
      text: "To minimize visibility of potential overextrusion at the start of an external perimeter when printing with Outer/Inner or Inner/Outer/Inner wall print order, the de-retraction is performed slightly on the inside from the start of the external perimeter. That way any potential over extrusion is hidden from the outside surface.\n\nThis is useful when printing with Outer/Inner or Inner/Outer/Inner wall print order as in these modes it is more likely an external perimeter is printed immediately after a de-retraction move."
      zh_CN: "为了最大限度地减少在使用外/内或内/外/内墙打印顺序时，外墙起始处的潜在过挤出，在外墙起始处外略微向内执行回填。这样，任何潜在的过挤都会隐藏在外表面之下。\n\n当使用外/内或内/外/内墙打印顺序时，这是有用的，因为在这些模式中，外墙可能会在回填移动之后立即打印。"
  slice_closing_radius:
    label:
      text: "Slice gap closing radius"
      zh_CN: "切片间隙闭合半径"
    tooltip:
      text: "Cracks smaller than 2x gap closing radius are being filled during the triangle mesh slicing. The gap closing operation may reduce the final print resolution, therefore it is advisable to keep the value reasonably low."
      zh_CN: "在三角形网格切片过程中，小于2倍间隙闭合半径的裂纹将被填充。间隙闭合操作可能会降低最终打印分辨率，因此建议降值保持在合理的较低水平"
    sidetext:
      text: "mm"
    category:
      text: "Quality"
      zh_CN: "质量"
  resolution:
    label:
      text: "Resolution"
      zh_CN: "分辨率"
    tooltip:
      text: "The G-code path is generated after simplifying the contour of models to avoid too many points and G-code lines. Smaller value means higher resolution and more time to slice."
      zh_CN: "为了避免G-code文件中过密集的点和走线，G-code走线通常是在简化模型的外轮廓之后生成。越小的数值代表更高的分辨率，同时需要更长的切片时间。"
    sidetext:
      text: "mm"
  enable_arc_fitting:
    label:
      text: "Arc fitting"
      zh_CN: "圆弧拟合"
    tooltip:
      text: "Enable this to get a G-code file which has G2 and G3 moves. The fitting tolerance is same as the resolution.\n\nNote: For Klipper machines, this option is recommended to be disabled. Klipper does not benefit from arc commands as these are split again into line segments by the firmware. This results in a reduction in surface quality as line segments are converted to arcs by the slicer and then back to line segments by the firmware."
      zh_CN: "启用此设置，导出的G-code将包含G2 G3指令。圆弧拟合的容许值和精度相同。\n\n请注意：对于使用Klipper的打印机，建议禁用此选项。\nKlipper打印机并不会从圆弧拟合中受益，因为这些命令会被固件\n重新分割为线段。由于切片软件将线段转换为圆弧后再次被转换为\n线段进行打印，这样操作会导致打印件表面质量下降。"
  xy_hole_compensation:
    label:
      text: "X-Y hole compensation"
      zh_CN: "X-Y 孔洞尺寸补偿"
    tooltip:
      text: "Holes in objects will expand or contract in the XY plane by the configured value. Positive values make holes bigger, negative values make holes smaller. This function is used to adjust sizes slightly when the objects have assembling issues."
      zh_CN: "物体中的孔洞将在XY平面内根据配置值进行扩展或收缩。正值使孔洞变大，负值使孔洞变小。此功能用于在物体出现装配问题时微调尺寸。"
    sidetext:
      text: "mm"
    category:
      text: "Quality"
      zh_CN: "质量"
  xy_contour_compensation:
    label:
      text: "X-Y contour compensation"
      zh_CN: "X-Y 外轮廓尺寸补偿"
    tooltip:
      text: "Contours of objects will expand or contract in the XY plane by the configured value. Positive values make contours bigger, negative values make contours smaller. This function is used to adjust sizes slightly when the objects have assembling issues."
      zh_CN: "物体的外轮廓将在XY平面内根据配置值进行扩展或收缩。正值使轮廓变大，负值使轮廓变小。此功能用于在物体出现装配问题时微调尺寸。"
    sidetext:
      text: "mm"
    category:
      text: "Quality"
      zh_CN: "质量"
  elefant_foot_compensation:
    label:
      text: "Elephant foot compensation"
      zh_CN: "象脚补偿"
    tooltip:
      text: "Shrinks the initial layer on build plate to compensate for elephant foot effect."
      zh_CN: "将首层收缩用于补偿象脚效应"
    sidetext:
      text: "mm"
    category:
      text: "Quality"
      zh_CN: "质量"
  elefant_foot_compensation_layers:
    label:
      text: "Elephant foot compensation layers"
      zh_CN: "象脚补偿层数"
    tooltip:
      text: "The number of layers on which the elephant foot compensation will be active. The first layer will be shrunk by the elephant foot compensation value, then the next layers will be linearly shrunk less, up to the layer indicated by this value."
    sidetext:
      text: "layers"
      zh_CN: "层"
    category:
      text: "Quality"
      zh_CN: "质量"
  precise_outer_wall:
    label:
      text: "Precise wall"
      zh_CN: "精准外墙尺寸"
    tooltip:
      text: "Improve shell precision by adjusting outer wall spacing. This also improves layer consistency. NOTE: This option will be ignored for outer-inner or inner-outer-inner wall sequences."
      zh_CN: "通过调整墙壁间距来提高外墙精度，同时改善层间一致性。注意：当壁序列为外内或内外内时，此选项将被忽略。"
    category:
      text: "Quality"
      zh_CN: "质量"
  precise_z_height:
    label:
      text: "Precise Z height"
      zh_CN: "精准Z高度"
    tooltip:
      text: "Enable this to get precise z height of object after slicing. It will get the precise object height by fine-tuning the layer heights of the last few layers. Note that this is an experimental parameter."
      zh_CN: "开启这个设置，对象在切片后将得到精准的Z高度。它将通过微调对象最后几层的层高来确保对象Z高度精准。注意这是一个实验性参数。"
  hole_to_polyhole:
    label:
      text: "Convert holes to polyholes"
      zh_CN: "将圆孔转换为多边型孔"
    tooltip:
      text: "Search for almost-circular holes that span more than one layer and convert the geometry to polyholes. Use the nozzle size and the (biggest) diameter to compute the polyhole.\nSee http://hydraraptor.blogspot.com/2011/02/polyholes.html"
      zh_CN: "搜索跨越多层的近似圆形孔，并将几何形状转换为多边形孔。使用喷嘴尺寸和（最大）直径来计算多边形孔。\n参见http://hydraraptor.blogspot.com/2011/02/polyholes.html"
    category:
      text: "Quality"
      zh_CN: "质量"
  hole_to_polyhole_threshold:
    label:
      text: "Polyhole detection margin"
      zh_CN: "多边型孔检测边缘"
    tooltip:
      text: "Maximum defection of a point to the estimated radius of the circle.\nAs cylinders are often exported as triangles of varying size, points may not be on the circle circumference. This setting allows you some leeway to broaden the detection.\nIn mm or in % of the radius."
      zh_CN: "点到圆半径的最大偏差。\n由于圆柱体通常被导出为大小不同的三角形，因此点可能不在圆周上。\n此设置允许您有一些余地来扩大检测范围。\n以毫米或半径的百分比表示。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  hole_to_polyhole_twisted:
    label:
      text: "Polyhole twist"
      zh_CN: "扭曲多边型孔"
    tooltip:
      text: "Rotate the polyhole every layer."
      zh_CN: "按层旋转多边形孔。"
    category:
      text: "Quality"
      zh_CN: "质量"
  ironing_type:
    label:
      text: "Ironing Type"
      zh_CN: "熨烫类型"
    tooltip:
      text: "Ironing is using small flow to print on same height of surface again to make flat surface more smooth. This setting controls which layer being ironed"
      zh_CN: "熨烫指的是使用小流量在表面的同高度打印，进而是的平面更加光滑。这个设置用于设置哪些层进行熨烫。"
    category:
      text: "Quality"
      zh_CN: "质量"
    enum_labels:
      - text: "No ironing"
        zh_CN: "不熨烫"
      - text: "Top surfaces"
        zh_CN: "顶面"
      - text: "Topmost surface"
        zh_CN: "最顶面"
      - text: "All solid layer"
        zh_CN: "所有实心层"
  ironing_pattern:
    label:
      text: "Ironing Pattern"
      zh_CN: "熨烫模式"
    tooltip:
      text: "The pattern that will be used when ironing."
      zh_CN: "熨烫时将使用的图案"
    category:
      text: "Quality"
      zh_CN: "质量"
    enum_labels:
      - text: "Rectilinear"
        zh_CN: "直线"
      - text: "Concentric"
        zh_CN: "同心"
  ironing_flow:
    label:
      text: "Ironing flow"
      zh_CN: "熨烫流量"
    tooltip:
      text: "The amount of material to extrude during ironing. Relative to flow of normal layer height. Too high value results in overextrusion on the surface."
      zh_CN: "熨烫时相对正常层高流量的材料量。过高的数值将会导致表面材料过挤出。"
    sidetext:
      text: "%"
    category:
      text: "Quality"
      zh_CN: "质量"
  ironing_spacing:
    label:
      text: "Ironing line spacing"
      zh_CN: "熨烫间距"
    tooltip:
      text: "The distance between the lines of ironing."
      zh_CN: "熨烫走线的间距"
    sidetext:
      text: "mm"
    category:
      text: "Quality"
      zh_CN: "质量"
  ironing_inset:
    label:
      text: "Ironing inset"
      zh_CN: "熨烫内缩"
    tooltip:
      text: "The distance to keep from the edges. A value of 0 sets this to half of the nozzle diameter."
      zh_CN: "与边缘保持的距离。0值将其设置为喷嘴直径的一半。"
    sidetext:
      text: "mm"
    category:
      text: "Quality"
      zh_CN: "质量"
  ironing_angle:
    label:
      text: "Ironing angle"
      zh_CN: "熨烫角度"
    tooltip:
      text: "The angle ironing is done at. A negative number disables this function and uses the default method."
      zh_CN: "熨烫的角度。设为负值将禁用此功能并使用默认方法。"
    sidetext:
      text: "°"
    category:
      text: "Quality"
      zh_CN: "质量"
  wall_generator:
    label:
      text: "Wall generator"
      zh_CN: "墙生成器"
    tooltip:
      text: "Classic wall generator produces walls with constant extrusion width and for very thin areas is used gap-fill. Arachne engine produces walls with variable extrusion width."
      zh_CN: "经典墙生成器产生的墙走线具有一致的挤出宽度，对狭窄区域使用填缝。Arachne引擎则产生变线宽的墙走线"
    category:
      text: "Quality"
      zh_CN: "质量"
    enum_labels:
      - text: "Classic"
        zh_CN: "经典"
      - text: "Arachne"
  wall_transition_angle:
    label:
      text: "Wall transitioning threshold angle"
      zh_CN: "墙过渡阈值角度"
    tooltip:
      text: "When to create transitions between even and odd numbers of walls. A wedge shape with an angle greater than this setting will not have transitions and no walls will be printed in the center to fill the remaining space. Reducing this setting reduces the number and length of these center walls, but may leave gaps or overextrude."
      zh_CN: "何时在偶数和奇数墙层数之间创建过渡段。角度大于这个阈值的楔形将不创建过渡段，并且不会在楔形中心打印墙走线以填补剩余空间。减小这个数值能减少中心墙走线的数量和长度，但可能会导致间隙或者过挤出"
    sidetext:
      text: "°"
    category:
      text: "Quality"
      zh_CN: "质量"
  wall_transition_filter_deviation:
    label:
      text: "Wall transitioning filter margin"
      zh_CN: "墙过渡过滤间距"
    tooltip:
      text: "Prevent transitioning back and forth between one extra wall and one less. This margin extends the range of extrusion widths which follow to [Minimum wall width - margin, 2 * Minimum wall width + margin]. Increasing this margin reduces the number of transitions, which reduces the number of extrusion starts/stops and travel time. However, large extrusion width variation can lead to under- or overextrusion problems. It's expressed as a percentage over nozzle diameter."
      zh_CN: "防止特定厚度变化规律的局部在多一层墙和少一层墙之间来回转换。这个参数将挤压宽度的范围扩大到[墙最小宽度-参数值, 2*墙最小宽度+参数值]。增大参数可以减少转换的次数，从而减少挤出开始/停止和空驶的时间。然而，大的挤出宽度变化会导致过挤出或欠挤出的问题。参数值表示为相对于喷嘴直径的百分比"
    sidetext:
      text: "%"
    category:
      text: "Quality"
      zh_CN: "质量"
  wall_transition_length:
    label:
      text: "Wall transition length"
      zh_CN: "墙过渡长度"
    tooltip:
      text: "When transitioning between different numbers of walls as the part becomes thinner, a certain amount of space is allotted to split or join the wall segments. It's expressed as a percentage over nozzle diameter."
      zh_CN: "当零件逐渐变薄导致墙的层数发生变化时，需要在过渡段分配一定的空间来分割和连接墙走线。参数值表示为相对于喷嘴直径的百分比"
    sidetext:
      text: "%"
    category:
      text: "Quality"
      zh_CN: "质量"
  wall_distribution_count:
    label:
      text: "Wall distribution count"
      zh_CN: "墙分布计数"
    tooltip:
      text: "The number of walls, counted from the center, over which the variation needs to be spread. Lower values mean that the outer walls don't change in width."
      zh_CN: "从中心开始计算的墙层数，线宽变化需要分布在这些墙走线上。较低的数值意味着外墙宽度更不易被改变"
    category:
      text: "Quality"
      zh_CN: "质量"
  initial_layer_min_bead_width:
    label:
      text: "First layer minimum wall width"
      zh_CN: "首层墙最小线宽"
    tooltip:
      text: "The minimum wall width that should be used for the first layer is recommended to be set to the same size as the nozzle. This adjustment is expected to enhance adhesion."
      zh_CN: "应用于首层的墙最小线宽，建议设置与喷嘴尺寸相同。这种调整有助于增强附着力。"
    sidetext:
      text: "%"
    category:
      text: "Quality"
      zh_CN: "质量"
  min_bead_width:
    label:
      text: "Minimum wall width"
      zh_CN: "墙最小线宽"
    tooltip:
      text: "Width of the wall that will replace thin features (according to the Minimum feature size) of the model. If the Minimum wall width is thinner than the thickness of the feature, the wall will become as thick as the feature itself. It's expressed as a percentage over nozzle diameter."
      zh_CN: "用于替换模型细小特征（根据最小特征尺寸）的墙线宽。如果墙最小线宽小于最小特征的厚度，则墙将变得和特征本身一样厚。参数值表示为相对喷嘴直径的百分比"
    sidetext:
      text: "%"
    category:
      text: "Quality"
      zh_CN: "质量"
  min_feature_size:
    label:
      text: "Minimum feature size"
      zh_CN: "最小特征尺寸"
    tooltip:
      text: "Minimum thickness of thin features. Model features that are thinner than this value will not be printed, while features thicker than than this value will be widened to the minimum wall width. It's expressed as a percentage over nozzle diameter."
    sidetext:
      text: "%"
    category:
      text: "Quality"
      zh_CN: "质量"
  min_length_factor:
    label:
      text: "Minimum wall length"
      zh_CN: "最小允许的墙长度"
    tooltip:
      text: "Adjust this value to prevent short, unclosed walls from being printed, which could increase print time. Higher values remove more and longer walls.\n\nNOTE: Bottom and top surfaces will not be affected by this value to prevent visual gaps on the outside of the model. Adjust 'One wall threshold' in the Advanced settings below to adjust the sensitivity of what is considered a top-surface. 'One wall threshold' is only visible if this setting is set above the default value of 0.5, or if single-wall top surfaces is enabled."
      zh_CN: "调整这个值以省略打印短的、未闭合的墙，这些可能会增加打印时间。设置较高的值将移除更多和更长的墙。\n\n注意：底部和顶部表面不会受到这个值的影响，以防止模型外部出现肉眼可见间隙。调整下面的高级设置中的“单层墙阈值”来调整什么被认为是顶部表面的敏感度。只有当这个设置高于默认值0.5，或者启用了单层顶部表面时，“单层墙阈值”才会显示。"
    sidetext:
      text: "mm"
    category:
      text: "Quality"
      zh_CN: "质量"
  wall_sequence:
    label:
      text: "Walls printing order"
      zh_CN: "墙顺序"
    tooltip:
      text: "Print sequence of the internal (inner) and external (outer) walls.\n\nUse Inner/Outer for best overhangs. This is because the overhanging walls can adhere to a neighbouring perimeter while printing. However, this option results in slightly reduced surface quality as the external perimeter is deformed by being squashed to the internal perimeter.\n\nUse Inner/Outer/Inner for the best external surface finish and dimensional accuracy as the external wall is printed undisturbed from an internal perimeter. However, overhang performance will reduce as there is no internal perimeter to print the external wall against. This option requires a minimum of 3 walls to be effective as it prints the internal walls from the 3rd perimeter onwards first, then the external perimeter and, finally, the first internal perimeter. This option is recommended against the Outer/Inner option in most cases.\n\nUse Outer/Inner for the same external wall quality and dimensional accuracy benefits of Inner/Outer/Inner option. However, the z seams will appear less consistent as the first extrusion of a new layer starts on a visible surface.\n\n "
      zh_CN: "内墙和外墙的打印顺序。\n\n使用内墙/外墙以获得最佳悬垂效果。这是因为在打印时，悬垂的墙可以粘附到相邻的围墙上。但是，这个选项会导致外墙的表面质量稍微降低，因为外墙被内墙挤压。\n\n使用内墙/外墙/内墙以获得最佳的外部表面质量和尺寸精度，因为外墙不会受内墙的影响但是，悬垂性能会降低，因为没有内墙来支撑打印外墙。此选项要求至少3层墙壁才能生效，因为它首先从第3个墙壁开始打印内墙，然后是外墙，最后是第一个内墙。在大多数情况下，此选项建议使用而不是外/内选项。\n\n使用外/内以获得与内/外/内选项相同的外部墙质量和尺寸精度优势。但是，由于新层的第一次挤出是在可见表面上开始的，因此z缝隙看起来不那么一致。\n\n "
    category:
      text: "Quality"
      zh_CN: "质量"
    enum_labels:
      - text: "Inner/Outer"
        zh_CN: "内墙/外墙"
      - text: "Outer/Inner"
        zh_CN: "外墙/内墙"
      - text: "Inner/Outer/Inner"
        zh_CN: "内墙/外墙/内墙"
  is_infill_first:
    label:
      text: "Print infill first"
      zh_CN: "首先打印填充"
    tooltip:
      text: "Order of wall/infill. When the tickbox is unchecked the walls are printed first, which works best in most cases.\n\nPrinting infill first may help with extreme overhangs as the walls have the neighbouring infill to adhere to. However, the infill will slightly push out the printed walls where it is attached to them, resulting in a worse external surface finish. It can also cause the infill to shine through the external surfaces of the part."
      zh_CN: "墙/填充的顺序。当未启用时，首先打印墙壁，这在大多数情况下都是最好的。\n\n首先打印填充可能有助于极端悬垂，因为墙壁有相邻的填充物可以粘附。但是，填充物会在附着在墙壁上的地方轻微地挤出打印的墙壁，导致外部表面质量更差。它还会导致填充物透过零件的外部表面。"
    category:
      text: "Quality"
      zh_CN: "质量"
  wall_direction:
    label:
      text: "Wall loop direction"
      zh_CN: "围墙打印方向"
    tooltip:
      text: "The direction which the wall loops are extruded when looking down from the top.\n\nBy default all walls are extruded in counter-clockwise, unless Reverse on even is enabled. Set this to any option other than Auto will force the wall direction regardless of the Reverse on even.\n\nThis option will be disabled if spiral vase mode is enabled."
      zh_CN: "从上往下看时墙循环挤出的方向。\n\n默认情况下，所有墙都以逆时针方向挤出，除非启用了偶数层反转。将此设置为自动以外的任何选项将强制墙方向，而不管偶数层反转如何。\n\n如果启用螺旋花瓶模式，此选项将被禁用。"
    category:
      text: "Quality"
      zh_CN: "质量"
    enum_labels:
      - text: "Auto"
        zh_CN: "自动"
      - text: "Counter clockwise"
        zh_CN: "逆时针"
      - text: "Clockwise"
        zh_CN: "顺时针"
  print_flow_ratio:
    label:
      text: "Flow ratio"
      zh_CN: "流量比例"
    tooltip:
      text: "The material may have volumetric change after switching between molten and crystalline states. This setting changes all extrusion flow of this filament in G-code proportionally. The recommended value range is between 0.95 and 1.05. You may be able to tune this value to get a nice flat surface if there is slight overflow or underflow.\n\nThe final object flow ratio is this value multiplied by the filament flow ratio."
      zh_CN: "材料在熔融和结晶状态之间切换后可能会发生体积变化。此设置会等比例改变此耗材在G-code中的所有挤出流量。推荐值范围在0.95到1.05之间。如果存在轻微的溢出或欠流，您可以调整此值以获得平整的表面。\n\n最终的对象流量比率是此值乘以耗材流量比率。"
  top_solid_infill_flow_ratio:
    label:
      text: "Top surface flow ratio"
      zh_CN: "顶部表面流量比例"
    tooltip:
      text: "This factor affects the amount of material for top solid infill. You can decrease it slightly to have smooth surface finish.\n\nThe actual top surface flow used is calculated by multiplying this value with the filament flow ratio, and if set, the object's flow ratio."
    category:
      text: "Advanced"
      zh_CN: "高级"
  bottom_solid_infill_flow_ratio:
    label:
      text: "Bottom surface flow ratio"
      zh_CN: "底部表面流量比例"
    tooltip:
      text: "This factor affects the amount of material for bottom solid infill.\n\nThe actual bottom solid infill flow used is calculated by multiplying this value with the filament flow ratio, and if set, the object's flow ratio."
    category:
      text: "Advanced"
      zh_CN: "高级"
  only_one_wall_top:
    label:
      text: "Only one wall on top surfaces"
      zh_CN: "顶面单层墙"
    tooltip:
      text: "Use only one wall on flat top surfaces, to give more space to the top infill pattern."
      zh_CN: "顶面只使用单层墙，从而更多的空间能够使用顶部填充图案"
    category:
      text: "Quality"
      zh_CN: "质量"
  min_width_top_surface:
    label:
      text: "One wall threshold"
      zh_CN: "单层墙阈值"
    tooltip:
      text: "If a top surface has to be printed and it's partially covered by another layer, it won't be considered at a top layer where its width is below this value. This can be useful to not let the 'one perimeter on top' trigger on surface that should be covered only by perimeters. This value can be a mm or a % of the perimeter extrusion width.\nWarning: If enabled, artifacts can be created if you have some thin features on the next layer, like letters. Set this setting to 0 to remove these artifacts."
      zh_CN: "如果顶面需要打印，但是它的一部分被其它层覆盖，那么当它的宽度小于这个值时，它不会被认为是顶层。这个设置可以用于避免在狭窄顶面上触发“顶面单层墙”。这个值可以是毫米或线宽的百分比。\n警告：如果启用，可能会在下一层上产生一些薄的特征，比如字母。将此设置设置为0可以消除这些伪影。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  only_one_wall_first_layer:
    label:
      text: "Only one wall on first layer"
      zh_CN: "首层仅单层墙"
    tooltip:
      text: "Use only one wall on first layer, to give more space to the bottom infill pattern."
      zh_CN: "首层只使用单层墙，从而更多的空间能够使用底部填充图案"
    category:
      text: "Quality"
      zh_CN: "质量"
  reduce_crossing_wall:
    label:
      text: "Avoid crossing walls"
      zh_CN: "避免跨越外墙"
    tooltip:
      text: "Detour and avoid to travel across wall which may cause blob on surface"
    category:
      text: "Quality"
      zh_CN: "质量"
  max_travel_detour_distance:
    label:
      text: "Avoid crossing walls - Max detour length"
      zh_CN: "避免跨越外墙-最大绕行长度"
    tooltip:
      text: "Maximum detour distance for avoiding crossing wall. Don't detour if the detour distance is larger than this value. Detour length could be specified either as an absolute value or as percentage (for example 50%) of a direct travel path. Zero to disable."
      zh_CN: "避免跨越外墙时的最大绕行距离。当绕行距离比这个数值大时，此次空驶不绕行。绕行距离可表达为绝对值，或者相对直线空驶长度的百分比(例如50%)。0表示禁用"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  small_area_infill_flow_compensation:
    label:
      text: "Small area flow compensation (beta)"
      zh_CN: "小区域填充流量补偿（试验）"
    tooltip:
      text: "Enable flow compensation for small infill areas."
      zh_CN: "启用小区域填充的流量补偿"
  small_area_infill_flow_compensation_model:
    label:
      text: "Flow Compensation Model"
      zh_CN: "流量补偿模型"
    tooltip:
      text: "Flow Compensation Model, used to adjust the flow for small infill areas. The model is expressed as a comma separated pair of values for extrusion length and flow correction factor. Each pair is on a separate line, followed by a semicolon, in the following format: \"1.234, 5.678;\""
  bridge_flow:
    label:
      text: "Bridge flow ratio"
      zh_CN: "桥接流量"
    tooltip:
      text: "Decrease this value slightly (for example 0.9) to reduce the amount of material for bridge, to improve sag.\n\nThe actual bridge flow used is calculated by multiplying this value with the filament flow ratio, and if set, the object's flow ratio."
    category:
      text: "Quality"
      zh_CN: "质量"
  internal_bridge_flow:
    label:
      text: "Internal bridge flow ratio"
      zh_CN: "内部搭桥流量比例"
    tooltip:
      text: "This value governs the thickness of the internal bridge layer. This is the first layer over sparse infill. Decrease this value slightly (for example 0.9) to improve surface quality over sparse infill.\n\nThe actual internal bridge flow used is calculated by multiplying this value with the bridge flow ratio, the filament flow ratio, and if set, the object's flow ratio."
    category:
      text: "Quality"
      zh_CN: "质量"
  bridge_density:
    label:
      text: "External bridge density"
      zh_CN: "外部桥接密度"
    tooltip:
      text: "Controls the density (spacing) of external bridge lines. Default is 100%.\n\nLower density external bridges can help improve reliability as there is more space for air to circulate around the extruded bridge, improving its cooling speed. Minimum is 10%.\n\nHigher densities can produce smoother bridge surfaces, as overlapping lines provide additional support during printing. Maximum is 120%. \nNote: Bridge density that is too high can cause warping or overextrusion."
    sidetext:
      text: "%"
    category:
      text: "Strength"
      zh_CN: "强度"
  internal_bridge_density:
    label:
      text: "Internal bridge density"
      zh_CN: "内部桥接密度"
    tooltip:
      text: "Controls the density (spacing) of internal bridge lines. 100% means solid bridge. Default is 100%.\n\nLower density internal bridges can help reduce top surface pillowing and improve internal bridge reliability as there is more space for air to circulate around the extruded bridge, improving its cooling speed.\n\nThis option works particularly well when combined with the second internal bridge over infill option, further improving internal bridging structure before solid infill is extruded."
      zh_CN: "控制内部桥接线的密度（间距）。100% 表示实心桥接，默认值为 100%。\n\n较低密度的内部桥接有助于减少顶面起鼓现象，并提高内部桥接的可靠性，因为挤出桥梁周围有更多空间供空气循环，加快冷却速度。\n\n此选项与第二层内部桥接覆盖填充功能结合使用时尤为有效，可在挤出实心填充前进一步改善内部桥接结构。"
    sidetext:
      text: "%"
    category:
      text: "Strength"
      zh_CN: "强度"
  thick_bridges:
    label:
      text: "Thick external bridges"
      zh_CN: "外部搭桥用厚桥"
    tooltip:
      text: "If enabled, bridges are more reliable, can bridge longer distances, but may look worse. If disabled, bridges look better but are reliable just for shorter bridged distances."
      zh_CN: "如果启用，桥接会更可靠，可以桥接更长的距离，但可能看起来更糟。如果关闭，桥梁看起来更好，但只适用于较短的桥接距离。"
    category:
      text: "Quality"
      zh_CN: "质量"
  thick_internal_bridges:
    label:
      text: "Thick internal bridges"
      zh_CN: "内部搭桥用厚桥"
    tooltip:
      text: "If enabled, thick internal bridges will be used. It's usually recommended to have this feature turned on. However, consider turning it off if you are using large nozzles."
      zh_CN: "如果启用，将使用厚内部桥接。通常建议打开此功能。但是，如果您使用大喷嘴，请考虑关闭它。"
    category:
      text: "Quality"
      zh_CN: "质量"
  enable_extra_bridge_layer:
    label:
      text: "Extra bridge layers (beta)"
      zh_CN: "额外桥层（测试版）"
    tooltip:
      text: "This option enables the generation of an extra bridge layer over internal and/or external bridges.\n\nExtra bridge layers help improve bridge appearance and reliability, as the solid infill is better supported. This is especially useful in fast printers, where the bridge and solid infill speeds vary greatly. The extra bridge layer results in reduced pillowing on top surfaces, as well as reduced separation of the external bridge layer from its surrounding perimeters.\n\nIt is generally recommended to set this to at least 'External bridge only', unless specific issues with the sliced model are found.\n\nOptions:\n1. Disabled - does not generate second bridge layers. This is the default and is set for compatibility purposes\n2. External bridge only - generates second bridge layers for external-facing bridges only. Please note that small bridges that are shorter or narrower than the set number of perimeters will be skipped as they would not benefit from a second bridge layer. If generated, the second bridge layer will be extruded parallel to the first bridge layer to reinforce the bridge strength\n3. Internal bridge only - generates second bridge layers for internal bridges over sparse infill only. Please note that the internal bridges count towards the top shell layer count of your model. The second internal bridge layer will be extruded as close to perpendicular to the first as possible. If multiple regions in the same island, with varying bridge angles are present, the last region of that island will be selected as the angle reference\n4. Apply to all - generates second bridge layers for both internal and external-facing bridges\n"
      zh_CN: "此选项启用在内部和/或外部桥接上生成额外桥接层。\n\n额外桥接层有助于改善桥接的外观和可靠性，因为实心填充得到了更好的支撑。这对于快速打印机特别有用，因为桥接和实心填充的速度差异很大。额外的桥接层可以减少顶面的枕化效应，同时减少外部桥接层与其周围周长的分离。\n\n通常建议将此设置为至少'仅外部桥接'，除非发现切片模型存在特定问题。\n\n选项：\n1. 禁用 - 不生成第二桥接层。这是默认设置，出于兼容性目的而设置\n2. 仅外部桥接 - 仅为面向外部的桥接生成第二桥接层。请注意，比设置的周长数更短或更窄的小桥接将被跳过，因为它们不会从第二桥接层中受益。如果生成，第二桥接层将与第一桥接层平行挤出，以增强桥接强度\n3. 仅内部桥接 - 仅为稀疏填充上的内部桥接生成第二桥接层。请注意，内部桥接计入模型的顶部外壳层数。第二内部桥接层将尽可能垂直于第一层挤出。如果在同一岛屿中存在多个具有不同桥接角度的区域，则该岛屿的最后一个区域将被选为角度参考\n4. 全部应用 - 为内部和面向外部的桥接生成第二桥接层\n"
    category:
      text: "Quality"
      zh_CN: "质量"
    enum_labels:
      - text: "Disabled"
        zh_CN: "禁用"
      - text: "External bridge only"
        zh_CN: "仅外部桥接"
      - text: "Internal bridge only"
        zh_CN: "仅内部桥接"
      - text: "Apply to all"
        zh_CN: "全部应用"
  dont_filter_internal_bridges:
    label:
      text: "Filter out small internal bridges"
      zh_CN: "过滤掉小的内部桥接"
    tooltip:
      text: "This option can help reduce pillowing on top surfaces in heavily slanted or curved models.\nBy default, small internal bridges are filtered out and the internal solid infill is printed directly over the sparse infill. This works well in most cases, speeding up printing without too much compromise on top surface quality.\nHowever, in heavily slanted or curved models, especially where too low a sparse infill density is used, this may result in curling of the unsupported solid infill, causing pillowing.\nEnabling limited filtering or no filtering will print internal bridge layer over slightly unsupported internal solid infill. The options below control the sensitivity of the filtering, i.e. they control where internal bridges are created:\n1. Filter - enables this option. This is the default behavior and works well in most cases\n2. Limited filtering - creates internal bridges on heavily slanted surfaces while avoiding unnecessary bridges. This works well for most difficult models\n3. No filtering - creates internal bridges on every potential internal overhang. This option is useful for heavily slanted top surface models; however, in most cases, it creates too many unnecessary bridges"
      zh_CN: "此选项可以帮助减少严重倾斜或弯曲模型顶面的枕化效应。\n默认情况下，小的内部桥接被过滤掉，内部实心填充直接打印在稀疏填充上。这在大多数情况下效果良好，可以加快打印速度而不会过分影响顶面质量。\n然而，在严重倾斜或弯曲的模型中，特别是当使用的稀疏填充密度过低时，这可能导致未支撑的实心填充翘曲，引起枕化效应。\n启用有限过滤或不过滤将在轻微未支撑的内部实心填充上打印内部桥接层。以下选项控制过滤的灵敏度，即它们控制在哪里创建内部桥接：\n1. 过滤 - 启用此选项。这是默认行为，在大多数情况下效果良好\n2. 有限过滤 - 在严重倾斜的表面上创建内部桥接，同时避免不必要的桥接。这对大多数困难的模型效果良好\n3. 不过滤 - 在每个潜在的内部悬垂上创建内部桥接。此选项对严重倾斜的顶面模型有用；但是，在大多数情况下，它会创建太多不必要的桥接"
    category:
      text: "Quality"
      zh_CN: "质量"
    enum_labels:
      - text: "Filter"
        zh_CN: "过滤"
      - text: "Limited filtering"
        zh_CN: "有限保留"
      - text: "No filtering"
        zh_CN: "保留全部"
  counterbore_hole_bridging:
    label:
      text: "Bridge counterbore holes"
      zh_CN: "沉孔搭桥"
    tooltip:
      text: "This option creates bridges for counterbore holes, allowing them to be printed without support. Available modes include:\n1. None: No bridge is created\n2. Partially Bridged: Only a part of the unsupported area will be bridged\n3. Sacrificial Layer: A full sacrificial bridge layer is created"
      zh_CN: "此选项为沉孔创建搭桥，使其可以在无支撑的情况下打印。可用的模式包括：\n1. 无：不创建搭桥。\n2. 部分搭桥：仅部分不支撑的区域将被搭桥。\n3. 牺牲层：创建一个完整的牺牲层。"
    category:
      text: "Quality"
      zh_CN: "质量"
    enum_labels:
      - text: "None"
        zh_CN: "无"
      - text: "Partially bridged"
        zh_CN: "部分搭桥"
      - text: "Sacrificial layer"
        zh_CN: "牺牲层"
  detect_overhang_wall:
    label:
      text: "Detect overhang wall"
      zh_CN: "识别悬空外墙"
    tooltip:
      text: "Detect the overhang percentage relative to line width and use different speed to print. For 100%% overhang, bridge speed is used."
      zh_CN: "检测悬空相对于线宽的百分比，并应用不同的速度打印。100%%的悬空将使用桥接速度。"
    category:
      text: "Quality"
      zh_CN: "质量"
  make_overhang_printable:
    label:
      text: "Make overhangs printable"
      zh_CN: "悬垂可打印化"
    tooltip:
      text: "Modify the geometry to print overhangs without support material."
      zh_CN: "修改几何形状使得悬垂部分无需支撑材料或者搭桥打印。"
    category:
      text: "Quality"
      zh_CN: "质量"
  make_overhang_printable_angle:
    label:
      text: "Make overhangs printable - Maximum angle"
      zh_CN: "悬垂可打印化的最大角度"
    tooltip:
      text: "Maximum angle of overhangs to allow after making more steep overhangs printable.90° will not change the model at all and allow any overhang, while 0 will replace all overhangs with conical material."
      zh_CN: "在使悬垂可打印化后，允许的悬垂最大角度。90°将完全不改变模型并允许任何悬垂，而0°将用圆锥形材料替换所有悬垂部分。"
    sidetext:
      text: "°"
    category:
      text: "Quality"
      zh_CN: "质量"
  make_overhang_printable_hole_size:
    label:
      text: "Make overhangs printable - Hole area"
      zh_CN: "最大孔洞面积"
    tooltip:
      text: "Maximum area of a hole in the base of the model before it's filled by conical material. A value of 0 will fill all the holes in the model base."
      zh_CN: "模型底部的孔洞在被圆锥形材料填充前所允许的最大面积。值为0将填充模型底部的所有孔洞。"
    sidetext:
      text: "mm²"
    category:
      text: "Quality"
      zh_CN: "质量"
  extra_perimeters_on_overhangs:
    label:
      text: "Extra perimeters on overhangs"
      zh_CN: "悬垂上的额外周长"
    tooltip:
      text: "Create additional perimeter paths over steep overhangs and areas where bridges cannot be anchored."
      zh_CN: "在陡峭的悬垂和无法固定桥接的区域上创建额外的周长路径。"
    category:
      text: "Quality"
      zh_CN: "质量"
  overhang_reverse:
    label:
      text: "Reverse on even"
      zh_CN: "反转偶数层悬垂方向"
    full_label:
      text: "Overhang reversal"
      zh_CN: "悬垂反转"
    tooltip:
      text: "Extrude perimeters that have a part over an overhang in the reverse direction on even layers. This alternating pattern can drastically improve steep overhangs.\n\nThis setting can also help reduce part warping due to the reduction of stresses in the part walls."
      zh_CN: "在偶数层上，将悬垂部分的走线反转。这种交替的走线模式可以大大改善陡峭的悬垂。\n\n这个设置也可以帮助减少零件变形，因为零件墙壁的应力减少了。"
    category:
      text: "Quality"
      zh_CN: "质量"
  overhang_reverse_internal_only:
    label:
      text: "Reverse only internal perimeters"
      zh_CN: "仅反转内部墙壁"
    full_label:
      text: "Reverse only internal perimeters"
      zh_CN: "仅反转内部墙壁"
    tooltip:
      text: "Apply the reverse perimeters logic only on internal perimeters.\n\nThis setting greatly reduces part stresses as they are now distributed in alternating directions. This should reduce part warping while also maintaining external wall quality. This feature can be very useful for warp prone material, like ABS/ASA, and also for elastic filaments, like TPU and Silk PLA. It can also help reduce warping on floating regions over supports.\n\nFor this setting to be the most effective, it is recommended to set the Reverse Threshold to 0 so that all internal walls print in alternating directions on even layers irrespective of their overhang degree."
      zh_CN: "仅在内墙上应用反转墙壁逻辑。\n\n这个设置大大减少了零件的应力，因为它们现在是交替方向分布的。这应该减少零件变形，同时保持外墙的质量。这个功能对于易变形的材料非常有用，比如ABS/ASA，也对于弹性耗材，比如TPU和丝光PLA。它还可以帮助减少支撑上的悬空区域的变形。\n\n为了使这个设置最有效，建议将反转阈值设置为0，这样所有的内墙都会在偶数层交替打印。"
    category:
      text: "Quality"
      zh_CN: "质量"
  overhang_reverse_threshold:
    label:
      text: "Reverse threshold"
      zh_CN: "反转阈值"
    full_label:
      text: "Overhang reversal threshold"
      zh_CN: "悬垂反转阈值"
    tooltip:
      text: "Number of mm the overhang need to be for the reversal to be considered useful. Can be a % of the perimeter width.\nValue 0 enables reversal on every even layers regardless.\nWhen Detect overhang wall is not enabled, this option is ignored and reversal happens on every even layers regardless."
      zh_CN: "判定悬垂反转需要的值（毫米），可以是线宽的百分比。\n值0表示在每个偶数层上都启用反转。\n当未启用检测悬垂时，此选项将被忽略，反转将在每个偶数层上发生。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Quality"
      zh_CN: "质量"
  wall_loops:
    label:
      text: "Wall loops"
      zh_CN: "墙层数"
    tooltip:
      text: "Number of walls of every layer."
      zh_CN: "每一层的外墙"
    category:
      text: "Strength"
      zh_CN: "强度"
  alternate_extra_wall:
    label:
      text: "Alternate extra wall"
      zh_CN: "交替添加额外内墙"
    tooltip:
      text: "This setting adds an extra wall to every other layer. This way the infill gets wedged vertically between the walls, resulting in stronger prints.\n\nWhen this option is enabled, the ensure vertical shell thickness option needs to be disabled.\n\nUsing lightning infill together with this option is not recommended as there is limited infill to anchor the extra perimeters to."
      zh_CN: "此设置在每隔一层添加一层额外的内墙。这样，填充物就会垂直地夹在墙壁之间，从而产生更牢固的打印件。\n\n启用此选项时，需要禁用确保垂直壳厚度选项。\n\n不建议将闪电填充与此选项一起使用，因为填充物有限，无法将额外的壁厚固定在填充物上。"
    category:
      text: "Strength"
      zh_CN: "强度"
  detect_thin_wall:
    label:
      text: "Detect thin wall"
      zh_CN: "检查薄壁"
    tooltip:
      text: "Detect thin wall which can't contain two line width. And use single line to print. Maybe printed not very well, because it's not closed loop."
      zh_CN: "检查无法容纳两条走线的薄壁。使用单条走线打印。可能会打地不是很好，因为走线不再闭合。"
    category:
      text: "Strength"
      zh_CN: "强度"
  top_surface_pattern:
    label:
      text: "Top surface pattern"
      zh_CN: "顶面图案"
    tooltip:
      text: "Line pattern of top surface infill."
      zh_CN: "顶面填充的走线图案"
    category:
      text: "Strength"
      zh_CN: "强度"
    enum_labels:
      - text: "Monotonic"
        zh_CN: "单调"
      - text: "Monotonic line"
        zh_CN: "单调线"
      - text: "Rectilinear"
        zh_CN: "直线"
      - text: "Aligned Rectilinear"
        zh_CN: "直线排列"
      - text: "Concentric"
        zh_CN: "同心"
      - text: "Hilbert Curve"
        zh_CN: "希尔伯特曲线"
      - text: "Archimedean Chords"
        zh_CN: "阿基米德和弦"
      - text: "Octagram Spiral"
        zh_CN: "八角螺旋"
  top_shell_layers:
    label:
      text: "Top shell layers"
      zh_CN: "顶部壳体层数"
    full_label:
      text: "Top solid layers"
      zh_CN: "顶部壳体层数"
    tooltip:
      text: "This is the number of solid layers of top shell, including the top surface layer. When the thickness calculated by this value is thinner than top shell thickness, the top shell layers will be increased."
      zh_CN: "顶部壳体实心层层数，包括顶面。当由该层数计算的厚度小于顶部壳体厚度，切片时会增加顶部壳体的层数"
    sidetext:
      text: "layers"
      zh_CN: "层"
    category:
      text: "Strength"
      zh_CN: "强度"
  top_shell_thickness:
    label:
      text: "Top shell thickness"
      zh_CN: "顶部壳体厚度"
    full_label:
      text: "Top shell thickness"
      zh_CN: "顶部壳体厚度"
    tooltip:
      text: "The number of top solid layers is increased when slicing if the thickness calculated by top shell layers is thinner than this value. This can avoid having too thin shell when layer height is small. 0 means that this setting is disabled and thickness of top shell is absolutely determined by top shell layers."
      zh_CN: "如果由顶部壳体层数算出的厚度小于这个数值，那么切片时将自动增加顶部壳体层数。这能够避免当层高很小时，顶部壳体过薄。0表示关闭这个设置，同时顶部壳体的厚度完全由顶部壳体层数决定"
    sidetext:
      text: "mm"
    category:
      text: "Strength"
      zh_CN: "强度"
  top_color_penetration_layers:
    label:
      text: "Top paint penetration layers"
      zh_CN: "顶部涂色渗透层数"
    tooltip:
      text: "This is  the number of layers of top paint penetration."
      zh_CN: "顶部涂色渗透的层数"
    sidetext:
      text: "layers"
      zh_CN: "层"
    category:
      text: "Strength"
      zh_CN: "强度"
  bottom_surface_pattern:
    label:
      text: "Bottom surface pattern"
      zh_CN: "底面图案"
    tooltip:
      text: "Line pattern of bottom surface infill, not bridge infill."
      zh_CN: "除了桥接外的底面填充的走线图案"
    category:
      text: "Strength"
      zh_CN: "强度"
    enum_labels:
      - text: "Monotonic"
        zh_CN: "单调"
      - text: "Monotonic line"
        zh_CN: "单调线"
      - text: "Rectilinear"
        zh_CN: "直线"
      - text: "Aligned Rectilinear"
        zh_CN: "直线排列"
      - text: "Concentric"
        zh_CN: "同心"
      - text: "Hilbert Curve"
        zh_CN: "希尔伯特曲线"
      - text: "Archimedean Chords"
        zh_CN: "阿基米德和弦"
      - text: "Octagram Spiral"
        zh_CN: "八角螺旋"
  bottom_shell_layers:
    label:
      text: "Bottom shell layers"
      zh_CN: "底部壳体层数"
    full_label:
      text: "Bottom shell layers"
      zh_CN: "底部壳体层数"
    tooltip:
      text: "This is the number of solid layers of bottom shell, including the bottom surface layer. When the thickness calculated by this value is thinner than bottom shell thickness, the bottom shell layers will be increased."
      zh_CN: "底部壳体实心层层数，包括底面。当由该层数计算的厚度小于底部壳体厚度，切片时会增加底部壳体的层数"
    sidetext:
      text: "layers"
      zh_CN: "层"
    category:
      text: "Strength"
      zh_CN: "强度"
  bottom_shell_thickness:
    label:
      text: "Bottom shell thickness"
      zh_CN: "底部壳体厚度"
    full_label:
      text: "Bottom shell thickness"
      zh_CN: "底部壳体厚度"
    tooltip:
      text: "The number of bottom solid layers is increased when slicing if the thickness calculated by bottom shell layers is thinner than this value. This can avoid having too thin shell when layer height is small. 0 means that this setting is disabled and thickness of bottom shell is absolutely determined by bottom shell layers."
      zh_CN: "如果由底部壳体层数算出的厚度小于这个数值，那么切片时将自动增加底部壳体层数。这能够避免当层高很小时，底部壳体过薄。0表示关闭这个设置，同时底部壳体的厚度完全由底部壳体层数决定"
    sidetext:
      text: "mm"
    category:
      text: "Strength"
      zh_CN: "强度"
  bottom_color_penetration_layers:
    label:
      text: "Bottom paint penetration layers"
      zh_CN: "底部涂色渗透层数"
    tooltip:
      text: "This is the number of layers of bottom paint penetration."
      zh_CN: "底部涂色渗透的层数。"
    sidetext:
      text: "layers"
      zh_CN: "层"
    category:
      text: "Strength"
      zh_CN: "强度"
  top_bottom_infill_wall_overlap:
    label:
      text: "Top/Bottom solid infill/wall overlap"
      zh_CN: "顶/底部实心填充/墙重叠率"
    tooltip:
      text: "Top solid infill area is enlarged slightly to overlap with wall for better bonding and to minimize the appearance of pinholes where the top infill meets the walls. A value of 25-30% is a good starting point, minimizing the appearance of pinholes. The percentage value is relative to line width of sparse infill."
      zh_CN: "顶部实心填充区域略微扩大，以便与墙壁重叠，以获得更好的粘合，并减少顶部填充与墙壁相接处的小孔出现。25-30%的值是一个很好的起点，可以减少小孔的出现。百分比值相对于稀疏填充的线宽"
    sidetext:
      text: "%"
    category:
      text: "Strength"
      zh_CN: "强度"
  sparse_infill_density:
    label:
      text: "Sparse infill density"
      zh_CN: "稀疏填充密度"
    tooltip:
      text: "Density of internal sparse infill, 100% turns all sparse infill into solid infill and internal solid infill pattern will be used."
      zh_CN: "内部稀疏填充的密度，100%会将所有稀疏填充变为实心填充，并将使用内部实心填充图案。"
    sidetext:
      text: "%"
    category:
      text: "Strength"
      zh_CN: "强度"
  fill_multiline:
    label:
      text: "Fill Multiline"
      zh_CN: "填充多线"
    tooltip:
      text: "Using multiple lines for the infill pattern, if supported by infill pattern."
      zh_CN: "如果填充图案支持，使用多线进行填充。"
  sparse_infill_pattern:
    label:
      text: "Sparse infill pattern"
      zh_CN: "稀疏填充图案"
    tooltip:
      text: "Line pattern for internal sparse infill."
      zh_CN: "内部稀疏填充的走线图案"
    category:
      text: "Strength"
      zh_CN: "强度"
    enum_labels:
      - text: "Rectilinear"
        zh_CN: "直线"
      - text: "Aligned Rectilinear"
        zh_CN: "直线排列"
      - text: "Zig Zag"
        zh_CN: "之字形"
      - text: "Cross Zag"
        zh_CN: "交叉之字"
      - text: "Locked Zag"
        zh_CN: "限定之字"
      - text: "Line"
        zh_CN: "线"
      - text: "Grid"
        zh_CN: "网格"
      - text: "Triangles"
        zh_CN: "三角形"
      - text: "Tri-hexagon"
        zh_CN: "内六边形"
      - text: "Cubic"
        zh_CN: "立方体"
      - text: "Adaptive Cubic"
        zh_CN: "自适应立方体"
      - text: "Quarter Cubic"
        zh_CN: "四分之一立方体"
      - text: "Support Cubic"
        zh_CN: "支撑立方体"
      - text: "Lightning"
        zh_CN: "闪电"
      - text: "Honeycomb"
        zh_CN: "蜂窝"
      - text: "3D Honeycomb"
        zh_CN: "3D 蜂窝"
      - text: "Lateral Honeycomb"
        zh_CN: "侧向蜂窝"
      - text: "Lateral Lattice"
        zh_CN: "侧向向晶格"
      - text: "Cross Hatch"
        zh_CN: "交叉层叠"
      - text: "TPMS-D"
        zh_CN: "TPMS-D结构"
      - text: "TPMS-FK"
        zh_CN: "TPMS-FK结构"
      - text: "Gyroid"
        zh_CN: "螺旋体"
      - text: "Concentric"
        zh_CN: "同心"
      - text: "Hilbert Curve"
        zh_CN: "希尔伯特曲线"
      - text: "Archimedean Chords"
        zh_CN: "阿基米德和弦"
      - text: "Octagram Spiral"
        zh_CN: "八角螺旋"
  infill_direction:
    label:
      text: "Sparse infill direction"
      zh_CN: "稀疏填充方向"
    tooltip:
      text: "Angle for sparse infill pattern, which controls the start or main direction of line."
      zh_CN: "稀疏填充图案的角度，决定走线的开始或整体方向。"
    sidetext:
      text: "°"
    category:
      text: "Strength"
      zh_CN: "强度"
  sparse_infill_rotate_template:
    label:
      text: "Sparse infill rotation template"
      zh_CN: "稀疏填充旋转模板"
    tooltip:
      text: "Rotate the sparse infill direction per layer using a template of angles. Enter comma-separated degrees (e.g., '0,30,60,90'). Angles are applied in order by layer and repeat when the list ends. Advanced syntax is supported: '+5' rotates +5° every layer; '+5#5' rotates +5° every 5 layers. See the Wiki for details. When a template is set, the standard infill direction setting is ignored. Note: some infill patterns (e.g., Gyroid) control rotation themselves; use with care."
    sidetext:
      text: "°"
    category:
      text: "Strength"
      zh_CN: "强度"
  skin_infill_density:
    label:
      text: "Skin infill density"
      zh_CN: "外壳填充密度"
    tooltip:
      text: "The portion of the model's outer surface within a certain depth range is called the skin. This parameter is used to adjust the density of this section. When two regions have the same sparse infill settings but different skin densities, this area will not be split into two separate regions. Default is as same as infill density."
    sidetext:
      text: "%"
    category:
      text: "Strength"
      zh_CN: "强度"
  skeleton_infill_density:
    label:
      text: "Skeleton infill density"
      zh_CN: "骨架填充密度"
    tooltip:
      text: "The remaining part of the model contour after removing a certain depth from the surface is called the skeleton. This parameter is used to adjust the density of this section. When two regions have the same sparse infill settings but different skeleton densities, their skeleton areas will develop overlapping sections. Default is as same as infill density."
    sidetext:
      text: "%"
    category:
      text: "Strength"
      zh_CN: "强度"
  infill_lock_depth:
    label:
      text: "Infill lock depth"
      zh_CN: "填充锁定深度"
    tooltip:
      text: "The parameter sets the overlapping depth between the interior and skin."
      zh_CN: "该参数设置内部与外壳之间的重叠深度"
    sidetext:
      text: "mm"
    category:
      text: "Strength"
      zh_CN: "强度"
  skin_infill_depth:
    label:
      text: "Skin infill depth"
      zh_CN: "外壳填充深度"
    tooltip:
      text: "The parameter sets the depth of skin."
      zh_CN: "该参数设置外壳深度"
    sidetext:
      text: "mm"
    category:
      text: "Strength"
      zh_CN: "强度"
  skin_infill_line_width:
    label:
      text: "Skin line width"
      zh_CN: "外壳线宽"
    tooltip:
      text: "Adjust the line width of the selected skin paths."
      zh_CN: "调整选中外壳路径的线宽"
    sidetext:
      text: "mm"
    category:
      text: "Strength"
      zh_CN: "强度"
  skeleton_infill_line_width:
    label:
      text: "Skeleton line width"
      zh_CN: "骨架线宽"
    tooltip:
      text: "Adjust the line width of the selected skeleton paths."
      zh_CN: "调整选中骨架路径的线宽"
    sidetext:
      text: "mm"
    category:
      text: "Strength"
      zh_CN: "强度"
  symmetric_infill_y_axis:
    label:
      text: "Symmetric infill Y axis"
      zh_CN: "对称填充Y轴"
    tooltip:
      text: "If the model has two parts that are symmetric about the Y axis, and you want these parts to have symmetric textures, please click this option on one of the parts."
    category:
      text: "Strength"
      zh_CN: "强度"
  infill_shift_step:
    label:
      text: "Infill shift step"
      zh_CN: "填充偏移步长"
    tooltip:
      text: "This parameter adds a slight displacement to each layer of infill to create a cross texture."
    sidetext:
      text: "mm"
    category:
      text: "Strength"
      zh_CN: "强度"
  lateral_lattice_angle_1:
    label:
      text: "Lateral lattice angle 1"
      zh_CN: "侧向晶格角度1"
    tooltip:
      text: "The angle of the first set of Lateral lattice elements in the Z direction. Zero is vertical."
      zh_CN: "第一组二维晶格单元在Z方向的角度。零表示垂直。"
    sidetext:
      text: "°"
    category:
      text: "Strength"
      zh_CN: "强度"
  lateral_lattice_angle_2:
    label:
      text: "Lateral lattice angle 2"
      zh_CN: "侧向晶格角度2"
    tooltip:
      text: "The angle of the second set of Lateral lattice elements in the Z direction. Zero is vertical."
      zh_CN: "第二组二维晶格单元在Z方向的角度。零表示垂直。"
    sidetext:
      text: "°"
    category:
      text: "Strength"
      zh_CN: "强度"
  infill_overhang_angle:
    label:
      text: "Infill overhang angle"
      zh_CN: "填充悬空角度"
    tooltip:
      text: "The angle of the infill angled lines. 60° will result in a pure honeycomb."
      zh_CN: "填充倾斜线的角度。60°将产生纯蜂窝结构。"
    sidetext:
      text: "°"
    category:
      text: "Strength"
      zh_CN: "强度"
  infill_anchor_max:
    label:
      text: "Maximum length of the infill anchor"
      zh_CN: "填充锚线的最大长度"
    tooltip:
      text: "Connect an infill line to an internal perimeter with a short segment of an additional perimeter. If expressed as percentage (example: 15%) it is calculated over infill extrusion width. Snapmaker Orca tries to connect two close infill lines to a short perimeter segment. If no such perimeter segment shorter than this parameter is found, the infill line is connected to a perimeter segment at just one side and the length of the perimeter segment taken is limited to infill_anchor, but no longer than this parameter.\nIf set to 0, the old algorithm for infill connection will be used, it should create the same result as with 1000 & 0."
      zh_CN: "用附加周长的一小段将填充线连接到内部周长。如果以百分比（例如：15%）表示，则计算填充拉伸宽度。Snapmaker Orca 试图将两条紧密的填充线连接到一个短的周长段。如果找不到比此参数短的周长线段，则填充线仅在一侧连接到周长线段，并且所采用的周长线段的长度仅限于 infl_anchor，但不超过此参数。将此参数设置为零以禁用锚点。"
    category:
      text: "Strength"
      zh_CN: "强度"
    enum_labels:
      - text: "0 (Simple connect)"
        zh_CN: "0（简单连接）"
      - text: "1 mm"
      - text: "2 mm"
      - text: "5 mm"
      - text: "10 mm"
      - text: "1000 (unlimited)"
        zh_CN: "1000（无限制）"
  infill_anchor:
    label:
      text: "Sparse infill anchor length"
      zh_CN: "稀疏填充锚线长度"
    tooltip:
      text: "Connect an infill line to an internal perimeter with a short segment of an additional perimeter. If expressed as percentage (example: 15%) it is calculated over infill extrusion width. Snapmaker Orca tries to connect two close infill lines to a short perimeter segment. If no such perimeter segment shorter than infill_anchor_max is found, the infill line is connected to a perimeter segment at just one side and the length of the perimeter segment taken is limited to this parameter, but no longer than anchor_length_max.\nSet this parameter to zero to disable anchoring perimeters connected to a single infill line."
      zh_CN: "用附加周长的一小段将填充线连接到内部周长。如果以百分比（例如：15%）表示，则计算填充拉伸宽度。Snapmaker Orca 试图将两条紧密的填充线连接到一个短的周长段。如果找不到短于“填充”和“锚点”最大值的周长线段，则填充线仅在一侧连接到周长线段，并且所取周长线段的长度仅限于此参数，但不超过“锚点长度”最大值。将此参数设置为零，以禁用连接到单个填充线的锚点周长。"
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Strength"
      zh_CN: "强度"
    enum_labels:
      - text: "0 (no open anchors)"
        zh_CN: "0 (无锚线)"
      - text: "1 mm"
      - text: "2 mm"
      - text: "5 mm"
      - text: "10 mm"
      - text: "1000 (unlimited)"
        zh_CN: "1000（无限制）"
  internal_solid_infill_pattern:
    label:
      text: "Internal solid infill pattern"
      zh_CN: "内部实心填充图案"
    tooltip:
      text: "Line pattern of internal solid infill. if the detect narrow internal solid infill be enabled, the concentric pattern will be used for the small area."
      zh_CN: "内部实心填充的线型图案。如果启用了检测狭窄的内部实心填充，将使用同心圆图案来填充小区域。"
    category:
      text: "Strength"
      zh_CN: "强度"
    enum_labels:
      - text: "Monotonic"
        zh_CN: "单调"
      - text: "Monotonic line"
        zh_CN: "单调线"
      - text: "Rectilinear"
        zh_CN: "直线"
      - text: "Aligned Rectilinear"
        zh_CN: "直线排列"
      - text: "Concentric"
        zh_CN: "同心"
      - text: "Hilbert Curve"
        zh_CN: "希尔伯特曲线"
      - text: "Archimedean Chords"
        zh_CN: "阿基米德和弦"
      - text: "Octagram Spiral"
        zh_CN: "八角螺旋"
  solid_infill_direction:
    label:
      text: "Solid infill direction"
      zh_CN: "实心填充方向"
    tooltip:
      text: "Angle for solid infill pattern, which controls the start or main direction of line."
      zh_CN: "实心填充图案的角度，决定走线的开始或整体方向。"
    sidetext:
      text: "°"
    category:
      text: "Strength"
      zh_CN: "强度"
  solid_infill_rotate_template:
    label:
      text: "Solid infill rotation template"
      zh_CN: "实心填充旋转模板"
    tooltip:
      text: "This parameter adds a rotation of solid infill direction to each layer according to the specified template. The template is a comma-separated list of angles in degrees, e.g. '0,90'. The first angle is applied to the first layer, the second angle to the second layer, and so on. If there are more layers than angles, the angles will be repeated. Note that not all solid infill patterns support rotation."
    sidetext:
      text: "°"
    category:
      text: "Strength"
      zh_CN: "强度"
  gap_fill_target:
    label:
      text: "Apply gap fill"
      zh_CN: "启用间隙填充"
    tooltip:
      text: "Enables gap fill for the selected solid surfaces. The minimum gap length that will be filled can be controlled from the filter out tiny gaps option below.\n\nOptions:\n1. Everywhere: Applies gap fill to top, bottom and internal solid surfaces for maximum strength\n2. Top and Bottom surfaces: Applies gap fill to top and bottom surfaces only, balancing print speed, reducing potential over extrusion in the solid infill and making sure the top and bottom surfaces have no pinhole gaps\n3. Nowhere: Disables gap fill for all solid infill areas\n\nNote that if using the classic perimeter generator, gap fill may also be generated between perimeters, if a full width line cannot fit between them. That perimeter gap fill is not controlled by this setting.\n\nIf you would like all gap fill, including the classic perimeter generated one, removed, set the filter out tiny gaps value to a large number, like 999999.\n\nHowever this is not advised, as gap fill between perimeters is contributing to the model's strength. For models where excessive gap fill is generated between perimeters, a better option would be to switch to the arachne wall generator and use this option to control whether the cosmetic top and bottom surface gap fill is generated."
    category:
      text: "Strength"
      zh_CN: "强度"
    enum_labels:
      - text: "Everywhere"
        zh_CN: "所有地方"
      - text: "Top and bottom surfaces"
        zh_CN: "仅顶层和底层"
      - text: "Nowhere"
        zh_CN: "不填充"
  filter_out_gap_fill:
    label:
      text: "Filter out tiny gaps"
      zh_CN: "忽略微小间隙"
    tooltip:
      text: "Don't print gap fill with a length is smaller than the threshold specified (in mm). This setting applies to top, bottom and solid infill and, if using the classic perimeter generator, to wall gap fill."
    sidetext:
      text: "mm"
    category:
      text: "Layers and Perimeters"
      zh_CN: "层和墙"
  infill_wall_overlap:
    label:
      text: "Infill/Wall overlap"
      zh_CN: "填充/墙 重叠"
    tooltip:
      text: "Infill area is enlarged slightly to overlap with wall for better bonding. The percentage value is relative to line width of sparse infill. Set this value to ~10-15% to minimize potential over extrusion and accumulation of material resulting in rough top surfaces."
      zh_CN: "填充区域略微扩大以与墙壁重叠，以获得更好的粘合。百分比值相对于稀疏填充的线宽。将此值设置为约10-15%，以最小化潜在的过挤出和材料积累，从而导致顶部表面粗糙。"
    sidetext:
      text: "%"
    category:
      text: "Strength"
      zh_CN: "强度"
  align_infill_direction_to_model:
    label:
      text: "Align infill direction to model"
      zh_CN: "对齐填充方向到模型"
    tooltip:
      text: "Aligns infill and surface fill directions to follow the model's orientation on the build plate. When enabled, fill directions rotate with the model to maintain optimal strength characteristics."
      zh_CN: "使填充和表面填充方向遵循模型在打印板上的方向。启用时，填充方向随模型旋转以保持最佳强度特性。"
    category:
      text: "Strength"
      zh_CN: "强度"
  extra_solid_infills:
    label:
      text: "Insert solid layers"
      zh_CN: "插入实心层"
    tooltip:
      text: "Insert solid infill at specific layers. Use N to insert every Nth layer, N#K to insert K consecutive solid layers every N layers (K is optional, e.g. '5#' equals '5#1'), or a comma-separated list (e.g. 1,7,9) to insert at explicit layers. Layers are 1-based."
      zh_CN: "在特定层插入实心填充。使用N表示每N层插入一次，N#K表示每N层插入K个连续的实心层（K是可选的，例如'5#'等于'5#1'），或使用逗号分隔的列表（例如1,7,9）在指定层插入。层数从1开始。"
    category:
      text: "Strength"
      zh_CN: "强度"
  bridge_angle:
    label:
      text: "External bridge infill direction"
      zh_CN: "外部桥接填充方向"
    tooltip:
      text: "Bridging angle override. If left to zero, the bridging angle will be calculated automatically. Otherwise the provided angle will be used for external bridges. Use 180°for zero angle."
      zh_CN: "搭桥角度覆盖。如果设置为零，该角度将自动计算。否则外部的桥接将用提供的值。180°表示0度。"
    sidetext:
      text: "°"
    category:
      text: "Strength"
      zh_CN: "强度"
  internal_bridge_angle:
    label:
      text: "Internal bridge infill direction"
      zh_CN: "内部桥接填充方向"
    tooltip:
      text: "Internal bridging angle override. If left to zero, the bridging angle will be calculated automatically. Otherwise the provided angle will be used for internal bridges. Use 180°for zero angle.\n\nIt is recommended to leave it at 0 unless there is a specific model need not to."
      zh_CN: "内部桥接角度覆盖。如果设置为0，则桥接角度将自动计算；否则将采用所提供的角度用于内部桥接。使用180°表示0角度。\n\n建议保持此值为0，除非有特殊模型要求。"
    sidetext:
      text: "°"
    category:
      text: "Strength"
      zh_CN: "强度"
  minimum_sparse_infill_area:
    label:
      text: "Minimum sparse infill threshold"
      zh_CN: "稀疏填充最小阈值"
    tooltip:
      text: "Sparse infill area which is smaller than threshold value is replaced by internal solid infill."
      zh_CN: "小于这个阈值的稀疏填充区域将会被内部实心填充替代。"
    sidetext:
      text: "mm²"
    category:
      text: "Strength"
      zh_CN: "强度"
  infill_combination:
    label:
      text: "Infill combination"
      zh_CN: "合并填充"
    tooltip:
      text: "Automatically Combine sparse infill of several layers to print together to reduce time. Wall is still printed with original layer height."
      zh_CN: "自动合并若干层稀疏填充一起打印以可缩短时间。内外墙依然保持原始层高打印。"
    category:
      text: "Strength"
      zh_CN: "强度"
  infill_combination_max_layer_height:
    label:
      text: "Infill combination - Max layer height"
      zh_CN: "填充组合 - 最大层高"
    tooltip:
      text: "Maximum layer height for the combined sparse infill.\n\nSet it to 0 or 100% to use the nozzle diameter (for maximum reduction in print time) or a value of ~80% to maximize sparse infill strength.\n\nThe number of layers over which infill is combined is derived by dividing this value with the layer height and rounded down to the nearest decimal.\n\nUse either absolute mm values (eg. 0.32mm for a 0.4mm nozzle) or % values (eg 80%). This value must not be larger than the nozzle diameter."
    sidetext:
      text: "mm or %"
      zh_CN: "mm 或 %"
    category:
      text: "Strength"
      zh_CN: "强度"
  detect_narrow_internal_solid_infill:
    label:
      text: "Detect narrow internal solid infill"
      zh_CN: "识别狭窄内部实心填充"
    tooltip:
      text: "This option will auto-detect narrow internal solid infill areas. If enabled, the concentric pattern will be used for the area to speed up printing. Otherwise, the rectilinear pattern will be used by default."
      zh_CN: "此选项用于自动识别内部狭窄的实心填充。开启后，将对狭窄实心区域使用同心填充加快打印速度。否则使用默认的直线填充。"
    category:
      text: "Strength"
      zh_CN: "强度"
  ensure_vertical_shell_thickness:
    label:
      text: "Ensure vertical shell thickness"
      zh_CN: "确保垂直外壳厚度"
    tooltip:
      text: "Add solid infill near sloping surfaces to guarantee the vertical shell thickness (top+bottom solid layers)\nNone: No solid infill will be added anywhere. Caution: Use this option carefully if your model has sloped surfaces\nCritical Only: Avoid adding solid infill for walls\nModerate: Add solid infill for heavily sloping surfaces only\nAll: Add solid infill for all suitable sloping surfaces\nDefault value is All."
      zh_CN: "在倾斜表面附近添加实心填充，以保证垂直外壳的厚度（顶部+底部实心层）\n无：任何地方都不会添加实心填充。注意：如果您的模型有倾斜表面，请谨慎使用此选项\n仅关键区域：避免为墙壁添加实心填充\n适量：仅为严重倾斜的表面添加实心填充\n全部：为所有适当的倾斜表面添加实心填充\n默认值为全部。"
    category:
      text: "Strength"
      zh_CN: "强度"
    enum_labels:
      - text: "None"
        zh_CN: "无"
      - text: "Critical Only"
        zh_CN: "仅关键区域"
      - text: "Moderate"
        zh_CN: "适量"
      - text: "All"
        zh_CN: "所有"
  initial_layer_speed:
    label:
      text: "Initial layer"
      zh_CN: "首层"
    tooltip:
      text: "Speed of initial layer except the solid infill part."
      zh_CN: "首层除实心填充之外的其他部分的打印速度"
    sidetext:
      text: "mm/s"
  initial_layer_infill_speed:
    label:
      text: "Initial layer infill"
      zh_CN: "首层填充"
    tooltip:
      text: "Speed of solid infill part of initial layer."
      zh_CN: "首层实心填充的打印速度"
    sidetext:
      text: "mm/s"
  initial_layer_travel_speed:
    label:
      text: "Initial layer travel speed"
      zh_CN: "首层空驶速度"
    tooltip:
      text: "Travel speed of initial layer."
      zh_CN: "首层空驶速度"
    sidetext:
      text: "mm/s or %"
      zh_CN: "mm/s 或 %"
    category:
      text: "Speed"
      zh_CN: "速度"
  slow_down_layers:
    label:
      text: "Number of slow layers"
      zh_CN: "慢速打印层数"
    tooltip:
      text: "The first few layers are printed slower than normal. The speed is gradually increased in a linear fashion over the specified number of layers."
      zh_CN: "减慢前几层的打印速度。打印速度会逐渐加速到满速"
    sidetext:
      text: "layers"
      zh_CN: "层"
    category:
      text: "Speed"
      zh_CN: "速度"
  outer_wall_speed:
    label:
      text: "Outer wall"
      zh_CN: "外墙"
    tooltip:
      text: "Speed of outer wall which is outermost and visible. It's used to be slower than inner wall speed to get better quality."
      zh_CN: "外墙的打印速度。它通常使用比内壁速度慢的速度，以获得更好的质量。"
    sidetext:
      text: "mm/s"
    category:
      text: "Speed"
      zh_CN: "速度"
  inner_wall_speed:
    label:
      text: "Inner wall"
      zh_CN: "内墙"
    tooltip:
      text: "Speed of inner wall."
      zh_CN: "内圈墙打印速度"
    sidetext:
      text: "mm/s"
    category:
      text: "Speed"
      zh_CN: "速度"
  small_perimeter_speed:
    label:
      text: "Small perimeters"
      zh_CN: "微小部位"
    tooltip:
