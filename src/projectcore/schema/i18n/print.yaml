      zh_CN: "类型"
    tooltip:
      text: "Normal (auto) and Tree (auto) are used to generate support automatically. If Normal (manual) or Tree (manual) is selected, only support enforcers are generated."
      zh_CN: "普通（自动）和树状（自动）用于自动生成支撑。如果选择普通（手动）或树状（手动），则仅在支撑强制面上生成支撑。"
    category:
