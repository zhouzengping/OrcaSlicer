# Generated by scripts/schema_gen/generate_schema.py -- do not edit by hand
# 展示层：每个 key 的源码原文 + 已有翻译。结构与语义在主 YAML，
# 一切「显示什么、翻译成什么」在这里。单个 key 的完整字段示例
# （合成全部展示字段，实际 key 只带其中子集）：
#   example_key:
#     label:                  # 主标签（选项行标题）
#       text: "Layer height"  # 源码原文（L() 的 msgid），永远存在
#       zh_CN: "层高"         # 有译文才出现该语言键；缺失 = 回落 text
#     full_label:             # 完整标签（对象设置面板等空间充裕处）
#       text: "..."
#     tooltip:                # 悬浮提示
#       text: "..."
#     sidetext:               # 行内单位/短后缀（mm、% 等，多为源码裸串无翻译）
#       text: "mm"
#     category:               # 搜索/归类的分类名
#       text: "Strength"
#     enum_labels:            # 枚举选项标签数组，与主 YAML 的 values 按下标平行
#       - text: "Auto"        # values[i] 显示为 enum_labels[i]，长度相等可 zip
#         zh_CN: "自动"
# 文件末尾 tabs:/groups: 节收录 tab/组显示名，{text, 语言} 结构同上
# （hidden.yaml 无此二节；Extruder %d 模板名原样保留，运行时格式化编号）。
version: 0.0.1
keys:
  filament_type:
    label:
      text: "Type"
      zh_CN: "类型"
    tooltip:
      text: "The material type of filament."
      zh_CN: "耗材丝的材料类型"
  filament_vendor:
    label:
      text: "Vendor"
      zh_CN: "供应商"
    tooltip:
      text: "Vendor of filament. For show only."
      zh_CN: "打印耗材的供应商。仅用于展示。"
  filament_soluble:
    label:
      text: "Soluble material"
      zh_CN: "可溶性材料"
    tooltip:
      text: "Soluble material is commonly used to print supports and support interfaces."
      zh_CN: "可溶性材料通常用于打印支撑和支撑面"
  filament_is_support:
    label:
      text: "Support material"
      zh_CN: "支撑材料"
    tooltip:
      text: "Support material is commonly used to print supports and support interfaces."
      zh_CN: "支撑材料通常用于打印支撑体和支撑接触面"
  required_nozzle_HRC:
    label:
      text: "Required nozzle HRC"
      zh_CN: "喷嘴硬度要求"
    tooltip:
      text: "Minimum HRC of nozzle required to print the filament. Zero means no checking of nozzle's HRC."
      zh_CN: "打印此材料的所需的最小喷嘴硬度。零值表示不检查喷嘴硬度。"
  default_filament_colour:
    label:
      text: "Default color"
      zh_CN: "缺省颜色"
    tooltip:
      text: "Default filament color.\nRight click to reset value to system default."
      zh_CN: "默认耗材颜色。\n右键单击以将值重置为系统默认值。"
  filament_diameter:
    label:
      text: "Diameter"
      zh_CN: "直径"
    tooltip:
      text: "Filament diameter is used to calculate extrusion in G-code, so it is important and should be accurate."
      zh_CN: "耗材丝直径被用于计算G-code文件中的挤出量。因此很重要，应尽可能精确。"
    sidetext:
      text: "mm"
  filament_density:
    label:
      text: "Density"
      zh_CN: "密度"
    tooltip:
      text: "Filament density. For statistics only."
      zh_CN: "耗材丝的密度。只用于统计信息。"
    sidetext:
      text: "g/cm³"
  filament_shrink:
    label:
      text: "Shrinkage (XY)"
      zh_CN: "收缩率（XY）"
    tooltip:
      text: "Enter the shrinkage percentage that the filament will get after cooling (94% if you measure 94mm instead of 100mm). The part will be scaled in xy to compensate. Only the filament used for the perimeter is taken into account.\nBe sure to allow enough space between objects, as this compensation is done after the checks."
      zh_CN: "冷却后耗材会收缩的百分比(如果测量的长度是94mm而不是100mm，则为是收缩率为94%)\n补偿将按比例缩放xy轴该补偿仅考虑墙壁所使用的耗材\n请确保物体之间有足够的间距，因为补偿是在边界检查之后进行"
    sidetext:
      text: "%"
  filament_shrinkage_compensation_z:
    label:
      text: "Shrinkage (Z)"
      zh_CN: "收缩率（Z）"
    tooltip:
      text: "Enter the shrinkage percentage that the filament will get after cooling (94% if you measure 94mm instead of 100mm). The part will be scaled in Z to compensate."
      zh_CN: "冷却后耗材会收缩的百分比(如果测量的长度是94mm而不是100mm，则为是收缩率为94%)\n补偿将按比例缩放Z轴"
    sidetext:
      text: "%"
  filament_cost:
    label:
      text: "Price"
      zh_CN: "价格"
    tooltip:
      text: "Filament price. For statistics only."
      zh_CN: "耗材丝的价格。只用于统计信息。"
    sidetext:
      text: "money/kg"
  temperature_vitrification:
    label:
      text: "Softening temperature"
      zh_CN: "软化温度"
    tooltip:
      text: "The material softens at this temperature, so when the bed temperature is equal to or greater than this, it's highly recommended to open the front door and/or remove the upper glass to avoid clogging."
      zh_CN: "材料在这个温度下会软化，因此当热床温度等于或高于这个温度时，强烈建议打开前门和/或去除上玻璃以避免堵塞。"
    sidetext:
      text: "\\u2103"
  idle_temperature:
    label:
      text: "Idle temperature"
      zh_CN: "待机温度"
    tooltip:
      text: "Nozzle temperature when the tool is currently not used in multi-tool setups. This is only used when 'Ooze prevention' is active in Print Settings. Set to 0 to disable."
      zh_CN: "在多工具设置中，当前未使用的工具的喷嘴温度。这仅在打印设置中启用'防滴漏'时使用。设置为0以禁用。"
    sidetext:
      text: "\\u2103"
  filament_tower_ironing_area:
    label:
      text: "Tower ironing area"
      zh_CN: "擦拭塔熨烫面积"
    tooltip:
      text: "Ironing area for prime tower interface layer (where different materials meet)."
      zh_CN: "擦拭塔的起始点熨烫面积"
    sidetext:
      text: "mm²"
  nozzle_temperature_range_low:
    label:
      text: "Min"
      zh_CN: "最小"
    sidetext:
      text: "\\u2103"
  nozzle_temperature_range_high:
    label:
      text: "Max"
      zh_CN: "最大"
    sidetext:
      text: "\\u2103"
  pellet_flow_coefficient:
    label:
      text: "Pellet flow coefficient"
      zh_CN: "颗粒流动系数"
    tooltip:
      text: "Pellet flow coefficient is empirically derived and allows for volume calculation for pellet printers.\n\nInternally it is converted to filament_diameter. All other volume calculations remain the same.\n\nfilament_diameter = sqrt( (4 * pellet_flow_coefficient) / PI )"
  filament_flow_ratio:
    label:
      text: "Flow ratio"
      zh_CN: "流量比例"
    tooltip:
      text: "The material may have volumetric change after switching between molten and crystalline states. This setting changes all extrusion flow of this filament in G-code proportionally. The recommended value range is between 0.95 and 1.05. You may be able to tune this value to get a nice flat surface if there is slight overflow or underflow."
      zh_CN: "材料经过融化后凝固可能会产生体积差异。这个设置会等比例改变所有挤出走线的挤出量。推荐的范围为0.95到1.05。发现大平层模型的顶面有轻微的缺料或多料时，或许可以尝试微调这个参数。"
  enable_pressure_advance:
    label:
      text: "Enable pressure advance"
      zh_CN: "启用压力提前"
    tooltip:
      text: "Enable pressure advance, auto calibration result will be overwritten once enabled."
      zh_CN: "启用压力提前，一旦启用会覆盖自动检测的结果"
  pressure_advance:
    label:
      text: "Pressure advance"
      zh_CN: "压力提前"
    tooltip:
      text: "Pressure advance (Klipper) AKA Linear advance factor (Marlin)."
      zh_CN: "压力提前(Klipper)或者线性提前(Marlin)"
  chamber_temperature:
    label:
      text: "Chamber temperature"
      zh_CN: "机箱温度"
    full_label:
      text: "Chamber temperature"
      zh_CN: "机箱温度"
    tooltip:
      text: "For high-temperature materials like ABS, ASA, PC, and PA, a higher chamber temperature can help suppress or reduce warping and potentially lead to higher interlayer bonding strength. However, at the same time, a higher chamber temperature will reduce the efficiency of air filtration for ABS and ASA.\n\nFor PLA, PETG, TPU, PVA, and other low-temperature materials, this option should be disabled (set to 0) as the chamber temperature should be low to avoid extruder clogging caused by material softening at the heat break.\n\nIf enabled, this parameter also sets a G-code variable named chamber_temperature, which can be used to pass the desired chamber temperature to your print start macro, or a heat soak macro like this: PRINT_START (other variables) CHAMBER_TEMP=[chamber_temperature]. This may be useful if your printer does not support M141/M191 commands, or if you desire to handle heat soaking in the print start macro if no active chamber heater is installed."
    sidetext:
      text: "\\u2103"
  activate_chamber_temp_control:
    label:
      text: "Activate temperature control"
      zh_CN: "激活温度控制"
    tooltip:
      text: "Enable this option for automated chamber temperature control. This option activates the emitting of an M191 command before the \"machine_start_gcode\"\n which sets the chamber temperature and waits until it is reached. In addition, it emits an M141 command at the end of the print to turn off the chamber heater, if present.\n\nThis option relies on the firmware supporting the M191 and M141 commands either via macros or natively and is usually used when an active chamber heater is installed."
  nozzle_temperature_initial_layer:
    label:
      text: "Initial layer"
      zh_CN: "首层"
    full_label:
      text: "Initial layer nozzle temperature"
      zh_CN: "首层打印温度"
    tooltip:
      text: "Nozzle temperature for printing initial layer when using this filament."
      zh_CN: "打印首层时的喷嘴温度"
    sidetext:
      text: "\\u2103"
  nozzle_temperature:
    label:
      text: "Other layers"
      zh_CN: "其它层"
    full_label:
      text: "Nozzle temperature"
      zh_CN: "喷嘴温度"
    tooltip:
      text: "Nozzle temperature for layers after the initial one."
      zh_CN: "除首层外的其它层的喷嘴温度"
