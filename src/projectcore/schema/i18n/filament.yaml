  filament_max_volumetric_speed:
    label:
      text: "Max volumetric speed"
      zh_CN: "最大体积速度"
    tooltip:
      text: "This setting stands for how much volume of filament can be melted and extruded per second. Printing speed is limited by max volumetric speed, in case of too high and unreasonable speed setting. Can't be zero."
      zh_CN: "这个设置表示在1秒内能够融化和挤出的耗材丝体积。打印速度会受到最大体积速度的限制，防止设置过高和不合理的速度。不允许设置为0。"
    sidetext:
      text: "mm³/s"
  close_fan_the_first_x_layers:
    label:
      text: "No cooling for the first"
      zh_CN: "关闭冷却对前"
    tooltip:
      text: "Turn off all cooling fans for the first few layers. This can be used to improve build plate adhesion."
      zh_CN: "对开始的一些层关闭所有的部件冷却风扇。通常关闭首层冷却用来获得更好的热床粘接"
    sidetext:
      text: "layers"
      zh_CN: "层"
  full_fan_speed_layer:
    label:
      text: "Full fan speed at layer"
      zh_CN: "满速风扇在"
    tooltip:
      text: "Fan speed will be ramped up linearly from zero at layer \"close_fan_the_first_x_layers\" to maximum at layer \"full_fan_speed_layer\". \"full_fan_speed_layer\" will be ignored if lower than \"close_fan_the_first_x_layers\", in which case the fan will be running at maximum allowed speed at layer \"close_fan_the_first_x_layers\" + 1."
      zh_CN: "风扇速度将从“禁用第一层”的零线性上升到“全风扇速度层”的最大。如果低于“禁用风扇第一层”，则“全风扇速度第一层”将被忽略，在这种情况下，风扇将在“禁用风扇第一层”+1层以最大允许速度运行。"
    sidetext:
      text: "layer"
      zh_CN: "层"
  fan_min_speed:
    label:
      text: "Fan speed"
      zh_CN: "风扇速度"
    tooltip:
      text: "Minimum speed for part cooling fan."
      zh_CN: "部件冷却风扇的最小转速"
    sidetext:
      text: "%"
  fan_cooling_layer_time:
    label:
      text: "Layer time"
      zh_CN: "层时间"
    tooltip:
      text: "Part cooling fan will be enabled for layers of which estimated time is shorter than this value. Fan speed is interpolated between the minimum and maximum fan speeds according to layer printing time."
      zh_CN: "当层预估打印时间小于该数值时，部件冷却风扇将会被开启。风扇转速将根据层打印时间在最大和最小风扇转速之间插值获得"
    sidetext:
      text: "s"
  fan_max_speed:
    label:
      text: "Fan speed"
      zh_CN: "风扇速度"
    tooltip:
      text: "Part cooling fan speed may be increased when auto cooling is enabled. This is the maximum speed for the part cooling fan."
      zh_CN: "启用自动冷却时，可能会提高部件冷却风扇的转速。这是部件冷却风扇的最大速度限制"
    sidetext:
      text: "%"
  slow_down_layer_time:
    label:
      text: "Layer time"
      zh_CN: "层时间"
    tooltip:
      text: "The printing speed in exported G-code will be slowed down when the estimated layer time is shorter than this value in order to get better cooling for these layers."
      zh_CN: "当层预估打印时间小于这个数值时，打印速度将会降低，从而获得更好的冷却效果。"
    sidetext:
      text: "s"
  reduce_fan_stop_start_freq:
    label:
      text: "Keep fan always on"
      zh_CN: "保持风扇常开"
    tooltip:
      text: "Enabling this setting means that the part cooling fan will never stop completely and will run at least at minimum speed to reduce the frequency of starting and stopping."
      zh_CN: "如果勾选这个选项，部件冷却风扇将永远不会停止，并且会至少运行在最小风扇转速值以减少风扇的启停频次"
  slow_down_for_layer_cooling:
    label:
      text: "Slow printing down for better layer cooling"
      zh_CN: "降低打印速度 以得到更好的冷却"
    tooltip:
      text: "Enable this option to slow printing speed down to make the final layer time not shorter than the layer time threshold in \"Max fan speed threshold\", so that layer can be cooled for longer time. This can improve the cooling quality for needle and small details."
      zh_CN: "勾选这个选项，将降低打印速度，使得最终的层打印时间不小于\"最大风扇速度阈值\"里的层时间阈值，从而使得该层获得更久的冷却。这能够改善尖顶和小细节的冷却效果"
  dont_slow_down_outer_wall:
    label:
      text: "Don't slow down outer walls"
      zh_CN: "不减速外墙"
    tooltip:
      text: "If enabled, this setting will ensure external perimeters are not slowed down to meet the minimum layer time. This is particularly helpful in the below scenarios:\n1. To avoid changes in shine when printing glossy filaments\n2. To avoid changes in external wall speed which may create slight wall artifacts that appear like Z banding\n3. To avoid printing at speeds which cause VFAs (fine artifacts) on the external walls"
      zh_CN: "如果启用，此设置将确保外墙不会为了满足最小层时间而减速。这在以下情况下特别有帮助：\n1. 避免在打印光滑耗材时改变光泽\n2. 避免改变外墙速度，可能会产生轻微的墙壁伪影，看起来像z条纹\n3. 避免以会在外墙上产生VFAs（细微伪影）的速度打印"
  slow_down_min_speed:
    label:
      text: "Min print speed"
      zh_CN: "最小打印速度"
    tooltip:
      text: "The minimum print speed to which the printer slows down to maintain the minimum layer time defined above when the slowdown for better layer cooling is enabled."
    sidetext:
      text: "mm/s"
  enable_overhang_bridge_fan:
    label:
      text: "Force cooling for overhangs and bridges"
      zh_CN: "悬垂/桥接强制冷却"
    tooltip:
      text: "Enable this option to allow adjustment of the part cooling fan speed for specifically for overhangs, internal and external bridges. Setting the fan speed specifically for these features can improve overall print quality and reduce warping."
      zh_CN: "启用此选项以允许单独针对悬垂、内部桥接和外部桥接调整部件冷却风扇的速度。针对这些特性设置风扇速度可以提高整体打印质量并减少翘曲。"
  overhang_fan_threshold:
    label:
      text: "Overhang cooling activation threshold"
      zh_CN: "悬垂冷却激活阈值"
    tooltip:
      text: "When the overhang exceeds this specified threshold, force the cooling fan to run at the 'Overhang Fan Speed' set below. This threshold is expressed as a percentage, indicating the portion of each line's width that is unsupported by the layer beneath it. Setting this value to 0% forces the cooling fan to run for all outer walls, regardless of the overhang degree."
      zh_CN: "当悬垂超过此指定阈值时，强制部件冷却风扇按照下方设置的“悬垂风扇速度”运转。该阈值以百分比表示，指示每条走线宽度中未被下层支撑的部分。将此值设置为0%即使在任何悬垂条件下也会使风扇运转于所有外壁。"
    enum_labels:
      - text: "0%"
      - text: "10%"
      - text: "25%"
      - text: "50%"
      - text: "75%"
      - text: "95%"
  overhang_fan_speed:
    label:
      text: "Overhangs and external bridges fan speed"
      zh_CN: "悬垂和外部桥接风扇速度"
    tooltip:
      text: "Use this part cooling fan speed when printing bridges or overhang walls with an overhang threshold that exceeds the value set in the 'Overhangs cooling threshold' parameter above. Increasing the cooling specifically for overhangs and bridges can improve the overall print quality of these features.\n\nPlease note, this fan speed is clamped on the lower end by the minimum fan speed threshold set above. It is also adjusted upwards up to the maximum fan speed threshold when the minimum layer time threshold is not met."
      zh_CN: "当打印桥接结构或悬垂墙体时，如果悬垂程度超过上述“悬垂冷却阈值”所设定的值，则使用此部件冷却风扇速度。专门针对悬垂和桥接加大冷却力度，有助于提升这些特征整体的打印质量。\n\n请注意，此风扇速度的下限受前面设置的最小风扇速度阈值限制；当打印层时间未达到最小层时间阈值时，会相应上调至最大风扇速度阈值。"
    sidetext:
      text: "%"
  internal_bridge_fan_speed:
    label:
      text: "Internal bridges fan speed"
      zh_CN: "内部桥接风扇速度"
    tooltip:
      text: "The part cooling fan speed used for all internal bridges. Set to -1 to use the overhang fan speed settings instead.\n\nReducing the internal bridges fan speed, compared to your regular fan speed, can help reduce part warping due to excessive cooling applied over a large surface for a prolonged period of time."
      zh_CN: "用于所有内部桥接的部件冷却风扇转速。设置为 -1 时，将采用悬垂风扇转速设置。\n\n与常规风扇转速相比，降低内部桥接风扇转速可以帮助减少因长时间在大面积区域施加过度冷却而引起的零件变形。"
    sidetext:
      text: "%"
  support_material_interface_fan_speed:
    label:
      text: "Support interface fan speed"
      zh_CN: "支撐接触面风扇"
    tooltip:
      text: "This part cooling fan speed is applied when printing support interfaces. Setting this parameter to a higher than regular speed reduces the layer binding strength between supports and the supported part, making them easier to separate.\nSet to -1 to disable it.\nThis setting is overridden by disable_fan_first_layers."
      zh_CN: "在打印支撑接触面时使用此部件冷却风扇的转速。将此参数设置为高于正常速度可以降低支撑与被支撑零件之间的层粘结强度，使它们更易分离。\n设置为 -1 表示禁用该功能。\n该设置会被 disable_fan_first_layers 选项覆盖。"
    sidetext:
      text: "%"
  ironing_fan_speed:
    label:
      text: "Ironing fan speed"
      zh_CN: "熨烫风扇速度"
    tooltip:
      text: "This part cooling fan speed is applied when ironing. Setting this parameter to a lower than regular speed reduces possible nozzle clogging due to the low volumetric flow rate, making the interface smoother.\nSet to -1 to disable it."
    sidetext:
      text: "%"
  additional_cooling_fan_speed:
    label:
      text: "Fan speed"
      zh_CN: "风扇速度"
    tooltip:
      text: "Speed of auxiliary part cooling fan. Auxiliary fan will run at this speed during printing except the first several layers which is defined by no cooling layers.\nPlease enable auxiliary_fan in printer settings to use this feature. G-code command: M106 P2 S(0-255)"
      zh_CN: "辅助部件冷却风扇的转速。辅助部件冷却风扇将一直运行在该速度，除了设置的无需冷却的前若干层\n请在打印机设置中启用辅助风扇以使用此功能。G-code指令：M106 P2 S(0-255)"
    sidetext:
      text: "%"
  activate_air_filtration:
    label:
      text: "Activate air filtration"
      zh_CN: "启用空气过滤/排气"
    tooltip:
      text: "Activate for better air filtration. G-code command: M106 P3 S(0-255)"
      zh_CN: "启用空气过滤/排气风扇。G-code命令：M106 P3 S(0-255)"
  during_print_exhaust_fan_speed:
    label:
      text: "Fan speed"
      zh_CN: "风扇速度"
    tooltip:
      text: "Speed of exhaust fan during printing. This speed will override the speed in filament custom G-code."
      zh_CN: "打印过程中排气风扇的速度。此速度将覆盖耗材丝自定义G-code中的速度。"
    sidetext:
      text: "%"
  complete_print_exhaust_fan_speed:
    label:
      text: "Fan speed"
      zh_CN: "风扇速度"
    tooltip:
      text: "Speed of exhaust fan after printing completes."
      zh_CN: "打印完成后排气风扇的速度"
    sidetext:
      text: "%"
  filament_retraction_length:
    label:
      text: "Length"
      zh_CN: "长度"
    full_label:
      text: "Retraction Length"
      zh_CN: "回抽长度"
    tooltip:
      text: "Some amount of material in extruder is pulled back to avoid ooze during long travel. Set zero to disable retraction."
    sidetext:
      text: "mm"
  filament_z_hop:
    label:
      text: "Z-hop height"
      zh_CN: "Z抬升高度"
    tooltip:
      text: "Whenever the retraction is done, the nozzle is lifted a little to create clearance between nozzle and the print. It prevents nozzle from hitting the print when travel move. Using spiral lines to lift Z can prevent stringing."
      zh_CN: "回抽完成之后，喷嘴轻微抬升，和打印件之间产生一定间隙。这能够避免空驶时喷嘴和打印件剐蹭和碰撞。使用螺旋线抬升z能够减少拉丝。"
    sidetext:
      text: "mm"
  filament_z_hop_types:
    label:
      text: "Z-hop type"
      zh_CN: "Z抬升类型"
    tooltip:
      text: "Type of Z-hop."
      zh_CN: "Z轴抬升类型。"
    enum_labels:
      - text: "Auto"
        zh_CN: "自动"
      - text: "Normal"
        zh_CN: "普通"
      - text: "Slope"
        zh_CN: "梯形"
      - text: "Spiral"
        zh_CN: "螺旋"
  filament_retract_lift_above:
    label:
      text: "Only lift Z above"
      zh_CN: "仅在高度以上抬Z"
    tooltip:
      text: "If you set this to a positive value, Z lift will only take place above the specified absolute Z."
      zh_CN: "如果将其设置为正值，则Z抬升仅在指定的绝对Z之上发生"
    sidetext:
      text: "mm"
  filament_retract_lift_below:
    label:
      text: "Only lift Z below"
      zh_CN: "仅在高度以下抬Z"
    tooltip:
      text: "If you set this to a positive value, Z lift will only take place below the specified absolute Z."
      zh_CN: "如果将其设置为正值，则Z抬升仅在指定的绝对Z以下发生。"
    sidetext:
      text: "mm"
  filament_retract_lift_enforce:
    label:
      text: "On surfaces"
      zh_CN: "仅表面抬Z"
    tooltip:
      text: "Enforce Z-Hop behavior. This setting is impacted by the above settings (Only lift Z above/below)."
      zh_CN: "强制Z抬升行为。此设置受上述设置的影响（仅在高度以下抬Z/仅在高度以上抬Z）。"
    enum_labels:
      - text: "All Surfaces"
        zh_CN: "所有表面"
      - text: "Top Only"
        zh_CN: "仅顶面"
      - text: "Bottom Only"
        zh_CN: "仅底面"
      - text: "Top and Bottom"
        zh_CN: "顶面和地面"
  filament_retraction_speed:
    label:
      text: "Retraction Speed"
      zh_CN: "回抽速度"
    full_label:
      text: "Retraction Speed"
      zh_CN: "回抽速度"
    tooltip:
      text: "Speed for retracting filament from the nozzle."
      zh_CN: "从喷嘴回抽耗材的速度"
    sidetext:
      text: "mm/s"
  filament_deretraction_speed:
    label:
      text: "De-retraction Speed"
      zh_CN: "装填速度"
    full_label:
      text: "De-retraction Speed"
      zh_CN: "装填速度"
    tooltip:
      text: "Speed for reloading filament into the nozzle. Zero means same speed of retraction."
    sidetext:
      text: "mm/s"
  filament_retract_restart_extra:
    label:
      text: "Extra length on restart"
      zh_CN: "额外回填长度"
    tooltip:
      text: "When the retraction is compensated after the travel move, the extruder will push this additional amount of filament. This setting is rarely needed."
      zh_CN: "每当空驶后回抽被补偿时，挤出机将推入额外数量的耗材丝。很少需要此设置。"
    sidetext:
      text: "mm"
  filament_retraction_minimum_travel:
    label:
      text: "Travel distance threshold"
      zh_CN: "空驶距离阈值"
    tooltip:
      text: "Only trigger retraction when the travel distance is longer than this threshold."
      zh_CN: "只在空驶距离大于该数值时触发回抽。"
    sidetext:
      text: "mm"
  filament_retract_when_changing_layer:
    label:
      text: "Retract when change layer"
      zh_CN: "换层时回抽"
    tooltip:
      text: "Force a retraction when changes layer."
      zh_CN: "强制在换层时回抽。"
  filament_wipe:
    label:
      text: "Wipe while retracting"
      zh_CN: "回抽时擦拭"
    tooltip:
      text: "Move nozzle along the last extrusion path when retracting to clean any leaked material on the nozzle. This can minimize blobs when printing a new part after traveling."
      zh_CN: "当回抽时，让喷嘴沿着前面的走线方向继续移动，清除掉喷嘴上的漏料。这能够避免空驶结束打印新的区域时产生斑点。"
  filament_wipe_distance:
    label:
      text: "Wipe Distance"
      zh_CN: "擦拭距离"
    tooltip:
      text: "Describe how long the nozzle will move along the last path when retracting.\n\nDepending on how long the wipe operation lasts, how fast and long the extruder/filament retraction settings are, a retraction move may be needed to retract the remaining filament.\n\nSetting a value in the retract amount before wipe setting below will perform any excess retraction before the wipe, else it will be performed after."
      zh_CN: "喷嘴在回抽时将沿着最后路径移动的距离\n\n根据擦拭操作的距离以及挤出机/耗材丝回抽的速度和长度，可能需要执行额外的回抽动作以收回剩余的丝材。\n\n在下方的擦拭前回抽量设置中输入一个数值，将在擦拭动作之前执行任何超出部分的回抽，否则超出部分的回抽将在擦拭之后执行。"
    sidetext:
      text: "mm"
  filament_retract_before_wipe:
    label:
      text: "Retract amount before wipe"
      zh_CN: "擦拭前的回抽量"
    tooltip:
      text: "The length of fast retraction before wipe, relative to retraction length."
      zh_CN: "擦拭之前的回抽长度，用总回抽长度的百分比表示。"
    sidetext:
      text: "%"
  filament_long_retractions_when_cut:
    label:
      text: "Long retraction when cut (beta)"
      zh_CN: "切料时回抽（实验）"
    tooltip:
      text: "Experimental feature: Retracting and cutting off the filament at a longer distance during changes to minimize purge. While this reduces flush significantly, it may also raise the risk of nozzle clogs or other printing problems."
      zh_CN: "实验性选项。在更换耗材丝时，将耗材丝回抽一段距离后再切断以最小化冲刷。虽然这大大减少了冲刷，但也可能增加喷嘴堵塞或其他打印问题的风险。"
  filament_retraction_distances_when_cut:
    label:
      text: "Retraction distance when cut"
      zh_CN: "切料回抽距离"
    tooltip:
      text: "Experimental feature: Retraction length before cutting off during filament change."
      zh_CN: "实验性选项。在更换耗材丝时，切断前的回抽长度"
  filament_retract_length_toolchange:
    label:
      text: "Retraction Length (Toolchange)"
    full_label:
      text: "Retraction Length (Toolchange)"
    sidetext:
      text: "mm"
  filament_retract_restart_extra_toolchange:
    label:
      text: "Extra length on restart"
      zh_CN: "额外回填长度"
    tooltip:
      text: "When the retraction is compensated after changing tool, the extruder will push this additional amount of filament."
      zh_CN: "当换色后回抽被补偿时，挤出机将推入额外数量的耗材丝。"
    sidetext:
      text: "mm"
  filament_start_gcode:
    label:
      text: "Start G-code"
      zh_CN: "起始G-code"
    tooltip:
      text: "Start G-code when starting the printing of this filament."
      zh_CN: "开始使用这个耗材丝打印的起始G-code"
  filament_end_gcode:
    label:
      text: "End G-code"
      zh_CN: "结尾G-code"
    tooltip:
      text: "End G-code when finishing the printing of this filament."
      zh_CN: "结束使用该耗材打印时的结尾G-code"
  filament_minimal_purge_on_wipe_tower:
    label:
      text: "Minimal purge on wipe tower"
      zh_CN: "擦拭塔上的最小清理量"
    tooltip:
      text: "After a tool change, the exact position of the newly loaded filament inside the nozzle may not be known, and the filament pressure is likely not yet stable. Before purging the print head into an infill or a sacrificial object, Snapmaker Orca will always prime this amount of material into the wipe tower to produce successive infill or sacrificial object extrusions reliably."
      zh_CN: "换色后，新加载的耗材在喷嘴内的确切位置可能未知，耗材压力可能还不稳定。在冲刷打印头到填充或作为挤出废料之前，Snapmaker Orca将始终将这些的耗材丝冲刷到擦拭塔中以产生连续的填充或稳定的挤出废料。"
    sidetext:
      text: "mm³"
  filament_loading_speed_start:
    label:
      text: "Loading speed at the start"
      zh_CN: "加载初始速度"
    tooltip:
      text: "Speed used at the very beginning of loading phase."
      zh_CN: "最开始加载阶段的速度"
    sidetext:
      text: "mm/s"
  filament_loading_speed:
    label:
      text: "Loading speed"
      zh_CN: "加载速度"
    tooltip:
      text: "Speed used for loading the filament on the wipe tower."
      zh_CN: "用于擦拭塔加载耗材的速度。"
    sidetext:
      text: "mm/s"
  filament_unloading_speed_start:
    label:
      text: "Unloading speed at the start"
      zh_CN: "卸载初始速度"
    tooltip:
      text: "Speed used for unloading the tip of the filament immediately after ramming."
      zh_CN: "耗材尖端成型后立即卸载的速度"
    sidetext:
      text: "mm/s"
  filament_unloading_speed:
    label:
      text: "Unloading speed"
      zh_CN: "卸载速度"
    tooltip:
      text: "Speed used for unloading the filament on the wipe tower (does not affect initial part of unloading just after ramming)."
      zh_CN: "用于擦拭塔卸载耗材的速度（不影响尖端成型之后初始部分的速度）。"
    sidetext:
      text: "mm/s"
  filament_toolchange_delay:
    label:
      text: "Delay after unloading"
      zh_CN: "卸载后延迟"
    tooltip:
      text: "Time to wait after the filament is unloaded. May help to get reliable tool changes with flexible materials that may need more time to shrink to original dimensions."
      zh_CN: "耗材丝卸载后等待的时间。有助于柔性材料（收缩到原始尺寸需更多的时间）以获得可靠的换色。"
    sidetext:
      text: "s"
  filament_cooling_moves:
    label:
      text: "Number of cooling moves"
      zh_CN: "冷却移动次数"
    tooltip:
      text: "Filament is cooled by being moved back and forth in the cooling tubes. Specify desired number of these moves."
      zh_CN: "耗材丝通过在喉管中来回移动来冷却。指定所需的移动次数。"
  filament_cooling_initial_speed:
    label:
      text: "Speed of the first cooling move"
      zh_CN: "第一次冷却移动的速度"
    tooltip:
      text: "Cooling moves are gradually accelerating beginning at this speed."
      zh_CN: "从这个速度开始冷却移动逐渐加速"
    sidetext:
      text: "mm/s"
  filament_cooling_final_speed:
    label:
      text: "Speed of the last cooling move"
      zh_CN: "最后一次冷却移动的速度"
    tooltip:
      text: "Cooling moves are gradually accelerating towards this speed."
      zh_CN: "冷却移动向这个速度逐渐加速。"
    sidetext:
      text: "mm/s"
  filament_stamping_loading_speed:
    label:
      text: "Stamping loading speed"
      zh_CN: "尖端成型加载速度"
    tooltip:
      text: "Speed used for stamping."
      zh_CN: "用于尖端成型的速度"
  filament_stamping_distance:
    label:
      text: "Stamping distance measured from the center of the cooling tube"
      zh_CN: "从冷却管中心测量的尖端成型距离"
    tooltip:
      text: "If set to non-zero value, filament is moved toward the nozzle between the individual cooling moves (\"stamping\"). This option configures how long this movement should be before the filament is retracted again."
      zh_CN: "如果设置为非零值，则在各个冷却移动之间耗材会向喷嘴方向移动（“印模”）。该选项用于配置耗材在重新回抽前应移动多长时间。"
  filament_ramming_parameters:
    label:
      text: "Ramming parameters"
      zh_CN: "尖端成型参数"
    tooltip:
      text: "This string is edited by RammingDialog and contains ramming specific parameters."
      zh_CN: "此内容由尖端成型窗口编辑，包含尖端成型的特定参数。"
  filament_multitool_ramming:
    label:
      text: "Enable ramming for multi-tool setups"
      zh_CN: "启用多色尖端成型设置"
    tooltip:
      text: "Perform ramming when using multi-tool printer (i.e. when the 'Single Extruder Multimaterial' in Printer Settings is unchecked). When checked, a small amount of filament is rapidly extruded on the wipe tower just before the tool change. This option is only used when the wipe tower is enabled."
      zh_CN: "多色打印机执行尖端成型时（即，当打印机设置中的单挤出机多材料未选中时）。选中时，在换色之前，会迅速挤出少量耗材丝到擦拭塔上。此选项仅在启用擦拭塔时使用。"
  filament_multitool_ramming_volume:
    label:
      text: "Multi-tool ramming volume"
      zh_CN: "多色尖端成型体积"
    tooltip:
      text: "The volume to be rammed before the tool change."
      zh_CN: "换色前尖端成型的体积"
    sidetext:
      text: "mm³"
  filament_multitool_ramming_flow:
    label:
      text: "Multi-tool ramming flow"
      zh_CN: "多色尖端成型流量"
    tooltip:
      text: "Flow used for ramming the filament before the tool change."
      zh_CN: "换色前耗材尖端成型的流量"
    sidetext:
      text: "mm³/s"
  compatible_printers:
    label:
      text: "Select printers"
      zh_CN: "选择打印机"
  compatible_printers_condition:
    label:
      text: "Condition"
      zh_CN: "条件"
    tooltip:
      text: "A boolean expression using the configuration values of an active printer profile. If this expression evaluates to true, this profile is considered compatible with the active printer profile."
      zh_CN: "使用活动打印机配置文件的配置值的布尔表达式。如果此表达式计算为 true,则此配置文件将被视为与活动打印机配置文件兼容。"
  compatible_prints:
    label:
      text: "Select profiles"
      zh_CN: "选择配置文件"
  compatible_prints_condition:
    label:
      text: "Condition"
      zh_CN: "条件"
