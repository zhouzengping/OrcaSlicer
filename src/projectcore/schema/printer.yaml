#     nullable: true          # 值可为 null = 「自动 / 不覆盖」而非 0；仅 Setting
#                             # Overrides 回抽覆盖 key 出现，default 固定 [null]
#     default: "aligned"      # 默认值；float_or_percent 百分比写带引号字符串
